# Checks every generated page against its generator, builds the site with the same Jekyll and
# plugins as GitHub Pages (the github-pages gem in the Gemfile), adds the site-search index, checks the simulators, and publishes it. Pull requests build and index too, so a
# broken page or index shows up before it reaches main; only main is deployed.
#
# One-off setting: Settings → Pages → Build and deployment → Source: "GitHub Actions".

name: Build and deploy site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Pinned: ubuntu-latest moved to 26.04 (Nov 2026), which has no Python 3.9, and 3.9 is what
    # the Mac runs, so the generated-page check needs it.
    runs-on: ubuntu-24.04
    outputs:
      newest: ${{ steps.newest.outputs.newest }}
    steps:
      - uses: actions/checkout@v4

      # Every generated page must be exactly what its generator emits, or the next re-run quietly
      # undoes a hand edit (tools/generators/README.md). First, before anything else writes to the
      # tree. Python and the packages match the Mac; Trebuchet MS is the graphs' font, and without
      # it matplotlib lays every graph out differently.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: tools/generators/requirements.txt

      - name: Install the generators' font and packages
        run: |
          echo "ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true" | sudo debconf-set-selections
          # The runner's Ubuntu mirror sometimes drops out for a few minutes; try again before failing.
          for try in 1 2 3; do
            sudo apt-get update -qq || true
            sudo apt-get install -y -qq --fix-missing ttf-mscorefonts-installer && break
            [ "$try" = 3 ] && exit 1
            echo "apt failed (try $try); waiting 60s"; sleep 60
          done
          pip install -r tools/generators/requirements.txt

      - name: Check the generated pages
        run: python tools/generators/regen_all.py --check

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Build with Jekyll
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
          JEKYLL_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAGES_REPO_NWO: ${{ github.repository }}
          LANG: C.UTF-8
          LC_ALL: C.UTF-8

      - name: Build the search index
        run: npm run search

      # The stripboard bundle is built from tools/generators/stripboard/engine/; a stale copy fails here.
      - name: Check the shared stripboard renderer
        run: npm run stripboard -- --check

      # The test bench solver: its tests (every reading over 300 random part sets per board), then a stale bundle fails.
      - name: Check the test bench solver
        run: npm run bench -- --check

      # Every simulator against the site standard (CLAUDE.md "Simulations"), in a real browser.
      - name: Install a browser for the simulator check
        run: npx playwright install --with-deps chromium

      - name: Check the simulators
        run: npm run sims

      # Re-running an older main build must not publish over a newer one (run 192's re-run did,
      # 10 Nov 2026, and took the S3 Space pages off the site). Only main's newest commit deploys.
      - name: Check this is still main's newest commit
        id: newest
        if: github.event_name != 'pull_request'
        run: |
          git fetch -q --depth=1 origin main
          if [ "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA" ]; then
            echo "newest=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::main has moved on to $(git rev-parse --short FETCH_HEAD); not deploying this older build."
            echo "newest=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && steps.newest.outputs.newest == 'true'
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && needs.build.outputs.newest == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        # Pages sometimes sits in "syncing_files" past the 10-minute default (run 183).
        with:
          timeout: 1800000
