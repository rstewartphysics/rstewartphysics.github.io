<div id="astable-sim" style="max-width:900px;margin:auto;font-family:Trebuchet MS;">

  <h2 style="text-align:center;">555 Astable Simulator</h2>

  <!-- VIEW SWITCH -->
  <div style="text-align:center;margin-bottom:10px;">
    <button onclick="showView('circuit')" style="padding:8px 16px;">Circuit Diagram</button>
    <button onclick="showView('stripboard')" style="padding:8px 16px;">Stripboard Layout</button>
  </div>

  <!-- CIRCUIT VIEW -->
  <div id="view-circuit">
    <img src="/assets/electronics/555-circuit.png"
         alt="555 Astable Circuit"
         style="width:100%;border:1px solid #ccc;">
  </div>

  <!-- STRIPBOARD VIEW -->
  <div id="view-stripboard" style="display:none;">
    <img src="/assets/electronics/555-stripboard.png"
         alt="555 Stripboard Layout"
         style="width:100%;border:1px solid #ccc;">
  </div>

  <hr>

  <!-- PRESET BUTTONS -->
  <h3>Presets</h3>
  <div style="display:flex;flex-wrap:wrap;gap:10px;margin-bottom:10px;">
    <button onclick="applyPreset(1,68,10)">1 Hz Flash</button>
    <button onclick="applyPreset(1,220,3)">3 Hz Flash</button>
    <button onclick="applyPreset(1,68,1)">10 Hz Flash</button>
    <button onclick="applyPreset(1,150,10)">Equal On/Off</button>
    <button onclick="applyPreset(1,470,10)">0.5 Hz Slow</button>
  </div>

  <!-- CONTROLS -->
  <h3>Adjust Component Values</h3>

  <label>R1 (kΩ): <span id="r1-label">1</span></label>
  <input id="r1" type="range" min="1" max="100" value="1" oninput="updateSim()">

  <label>R2 (kΩ): <span id="r2-label">68</span></label>
  <input id="r2" type="range" min="1" max="500" value="68" oninput="updateSim()">

  <label>C1 (µF): <span id="c1-label">10</span></label>
  <input id="c1" type="range" min="1" max="200" value="10" oninput="updateSim()">

  <hr>

  <!-- LEDs -->
  <h3>LED Output</h3>

  <div style="display:flex;justify-content:center;gap:30px;margin:10px 0;">
    <div style="text-align:center;">
      <div id="led-red" style="
        width:30px;height:30px;border-radius:50%;background:#200;
        transition:0.15s;box-shadow:0 0 6px #000;">
      </div>
      <small>Red LED<br>(pin 3 → GND)</small>
    </div>

    <div style="text-align:center;">
      <div id="led-green" style="
        width:30px;height:30px;border-radius:50%;background:#020;
        transition:0.15s;box-shadow:0 0 6px #000;">
      </div>
      <small>Green LED<br>(Vsupply → pin 3)</small>
    </div>
  </div>

  <hr>

  <!-- CANVAS GRAPHS -->
  <h3>Waveforms</h3>
  
  <p><strong>Output Square Wave</strong></p>
  <canvas id="waveform" width="800" height="150"
          style="width:100%;border:1px solid #ccc;background:black;"></canvas>

  <p><strong>Capacitor Voltage Curve</strong></p>
  <canvas id="cap-curve" width="800" height="150"
          style="width:100%;border:1px solid #ccc;background:black;"></canvas>

  <hr>

  <!-- CALCULATED VALUES -->
  <h3>Calculated Values</h3>
  <p><strong>Period T:</strong> <span id="val-T">—</span> s</p>
  <p><strong>Frequency f:</strong> <span id="val-f">—</span> Hz</p>
  <p><strong>Mark time Tm:</strong> <span id="val-Tm">—</span> s</p>
  <p><strong>Space time Ts:</strong> <span id="val-Ts">—</span> s</p>
  <p><strong>Duty cycle:</strong> <span id="val-duty">—</span>%</p>

</div>


<script>
/* -------------------- VIEW SWITCH -------------------- */
function showView(v){
  document.getElementById("view-circuit").style.display = v==="circuit"?"block":"none";
  document.getElementById("view-stripboard").style.display = v==="stripboard"?"block":"none";
}

/* -------------------- GLOBALS -------------------- */
let T = 1;
let Tm = 0.5;
let Ts = 0.5;
let outputHigh = false;
let simTime = 0;

let wave = document.getElementById("waveform").getContext("2d");
let cap = document.getElementById("cap-curve").getContext("2d");

/* -------------------- PRESETS -------------------- */
function applyPreset(R1, R2, C1){
  document.getElementById("r1").value = R1;
  document.getElementById("r2").value = R2;
  document.getElementById("c1").value = C1;
  updateSim();
}

/* -------------------- UPDATE SIM -------------------- */
function updateSim(){
  let R1 = parseFloat(r1.value) * 1000;
  let R2 = parseFloat(r2.value) * 1000;
  let C1 = parseFloat(c1.value) / 1e6;

  r1-label.innerText = (R1/1000).toFixed(0);
  r2-label.innerText = (R2/1000).toFixed(0);
  c1-label.innerText = (C1*1e6).toFixed(0);

  Tm = 0.7*(R1+R2)*C1;
  Ts = 0.7*R2*C1;
  T = Tm + Ts;

  let f = 1 / T;
  let duty = (Tm/T)*100;

  document.getElementById("val-T").innerText = T.toFixed(3);
  document.getElementById("val-f").innerText = f.toFixed(2);
  document.getElementById("val-Tm").innerText = Tm.toFixed(3);
  document.getElementById("val-Ts").innerText = Ts.toFixed(3);
  document.getElementById("val-duty").innerText = duty.toFixed(1);
}

/* -------------------- ANIMATION LOOP -------------------- */
function animate(){
  requestAnimationFrame(animate);

  simTime += 0.01;  
  let t = simTime % T;
  outputHigh = t < Tm;

  /* ----- LEDs ----- */
  let red = document.getElementById("led-red");
  let green = document.getElementById("led-green");

  if(outputHigh){
    red.style.background = "#f33";
    red.style.boxShadow = "0 0 12px #f33";

    green.style.background = "#030";
    green.style.boxShadow = "0 0 4px #000";
  } else {
    green.style.background = "#3f3";
    green.style.boxShadow = "0 0 12px #3f3";

    red.style.background = "#300";
    red.style.boxShadow = "0 0 4px #000";
  }

  /* ---------------- WAVEFORM GRAPH ---------------- */
  wave.fillStyle = "black";
  wave.fillRect(0,0,800,150);

  wave.strokeStyle = "#0f0";
  wave.lineWidth = 2;

  wave.beginPath();
  for(let x=0; x<800; x++){
    let time = (simTime - (800-x)/800*T*2) % T;
    let high = time < Tm;
    let y = high ? 30 : 120;
    wave.lineTo(x,y);
  }
  wave.stroke();

  /* ---------------- CAPACITOR GRAPH ---------------- */
  cap.fillStyle = "black";
  cap.fillRect(0,0,800,150);

  cap.strokeStyle = "#0af";
  cap.lineWidth = 2;

  cap.beginPath();
  for(let x=0; x<800; x++){
    let time = (simTime - (800-x)/800*T*2) % T;
    let v;

    if(time < Tm){ 
      // charging towards 2/3 VCC
      v = 1/3 + (2/3 - 1/3)*(time/Tm);
    } else {
      // discharging towards 1/3 VCC
      let t2 = time - Tm;
      v = 2/3 - (2/3 - 1/3)*(t2/Ts);
    }
    let y = 130 - v*120;
    cap.lineTo(x,y);
  }
  cap.stroke();
}

updateSim();
requestAnimationFrame(animate);
</script>
