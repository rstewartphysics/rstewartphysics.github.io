<div id="astable-sim" style="max-width:700px;margin:auto;font-family:Trebuchet MS;">
  <h2 style="text-align:center;">555 Astable Simulator</h2>

  <!-- VIEW SWITCH -->
  <div style="text-align:center;margin-bottom:10px;">
    <button onclick="showView('circuit')" style="padding:8px 16px;">Circuit Diagram</button>
    <button onclick="showView('stripboard')" style="padding:8px 16px;">Stripboard Layout</button>
  </div>

  <!-- CIRCUIT VIEW -->
  <div id="view-circuit">
    <img src="PLACEHOLDER-CIRCUIT.png" alt="555 Astable Circuit" style="width:100%;border:1px solid #ccc;">
  </div>

  <!-- STRIPBOARD VIEW -->
  <div id="view-stripboard" style="display:none;">
    <img src="PLACEHOLDER-STRIPBOARD.png" alt="555 Stripboard Layout" style="width:100%;border:1px solid #ccc;">
  </div>

  <hr>

  <!-- CONTROLS -->
  <h3>Adjust Component Values</h3>
  <label>R1 (kΩ): <span id="r1-label">1</span></label>
  <input id="r1" type="range" min="1" max="100" value="1" oninput="updateSim()">  

  <label>R2 (kΩ): <span id="r2-label">68</span></label>
  <input id="r2" type="range" min="1" max="500" value="68" oninput="updateSim()">  

  <label>C1 (µF): <span id="c1-label">10</span></label>
  <input id="c1" type="range" min="1" max="200" value="10" oninput="updateSim()">  

  <hr>

  <!-- OUTPUT LED -->
  <h3>Output</h3>
  <div id="led" style="
    width:30px;height:30px;border-radius:50%;
    background:#222;margin:auto;
    box-shadow:0 0 4px #000;">
  </div>

  <hr>

  <!-- CALCULATED VALUES -->
  <h3>Calculated Values</h3>
  <p><strong>Time Period T:</strong> <span id="val-T">—</span> s</p>
  <p><strong>Frequency f:</strong> <span id="val-f">—</span> Hz</p>
  <p><strong>Mark Time Tm:</strong> <span id="val-Tm">—</span> s</p>
  <p><strong>Space Time Ts:</strong> <span id="val-Ts">—</span> s</p>
  <p><strong>Duty Cycle:</strong> <span id="val-duty">—</span>%</p>
</div>

<script>
let ledState = false;
let timer = null;

// Switch views
function showView(view){
  document.getElementById("view-circuit").style.display =
      (view==="circuit"?"block":"none");
  document.getElementById("view-stripboard").style.display =
      (view==="stripboard"?"block":"none");
}

function updateSim(){
  let R1 = parseFloat(document.getElementById("r1").value)*1000;
  let R2 = parseFloat(document.getElementById("r2").value)*1000;
  let C1 = parseFloat(document.getElementById("c1").value)/1e6;

  // Labels
  document.getElementById("r1-label").innerText = (R1/1000);
  document.getElementById("r2-label").innerText = (R2/1000);
  document.getElementById("c1-label").innerText = (C1*1e6);

  // Astable equations
  let Tm = 0.7*(R1+R2)*C1;
  let Ts = 0.7*R2*C1;
  let T = Tm+Ts;
  let f = 1/T;
  let duty = (Tm/T)*100;

  // Update display
  document.getElementById("val-T").innerText = T.toFixed(3);
  document.getElementById("val-f").innerText = f.toFixed(2);
  document.getElementById("val-Tm").innerText = Tm.toFixed(3);
  document.getElementById("val-Ts").innerText = Ts.toFixed(3);
  document.getElementById("val-duty").innerText = duty.toFixed(1);

  // Restart LED flashing
  if(timer){ clearInterval(timer); }
  timer = setInterval(()=>{
    ledState = !ledState;
    document.getElementById("led").style.background =
      ledState ? "#ff4444" : "#222";
    document.getElementById("led").style.boxShadow =
      ledState ? "0 0 12px #f00" : "0 0 4px #000";
  }, T*1000/2); // update twice per cycle (high/low)
}

// Start on load
updateSim();
</script>
