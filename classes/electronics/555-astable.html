<script>
/* -------------------- VIEW SWITCH -------------------- */
function showView(v){
  document.getElementById("view-circuit").style.display =
      v==="circuit" ? "block" : "none";
  document.getElementById("view-stripboard").style.display =
      v==="stripboard" ? "block" : "none";
}

/* -------------------- GLOBALS -------------------- */
let T = 1, Tm = 0.5, Ts = 0.5;
let simTime = 0;
let outputHigh = false;

let wave, cap;

/* When page loads, attach canvases properly */
window.onload = function(){

  const wf = document.getElementById("waveform");
  const cc = document.getElementById("cap-curve");

  /* set canvas pixel width to match CSS width */
  wf.width = wf.clientWidth;
  cc.width = cc.clientWidth;

  wave = wf.getContext("2d");
  cap  = cc.getContext("2d");

  updateSim();
  requestAnimationFrame(animate);
};

/* -------------------- PRESETS -------------------- */
function applyPreset(R1, R2, C1){
  document.getElementById("r1").value = R1;
  document.getElementById("r2").value = R2;
  document.getElementById("c1").value = C1;
  updateSim();
}

/* -------------------- UPDATE SIM -------------------- */
function updateSim(){
  let R1 = parseFloat(document.getElementById("r1").value) * 1000;
  let R2 = parseFloat(document.getElementById("r2").value) * 1000;
  let C1 = parseFloat(document.getElementById("c1").value) / 1e6;

  document.getElementById("r1-label").innerText = (R1/1000).toFixed(0);
  document.getElementById("r2-label").innerText = (R2/1000).toFixed(0);
  document.getElementById("c1-label").innerText = (C1*1e6).toFixed(0);

  Tm = 0.7 * (R1 + R2) * C1;
  Ts = 0.7 * (R2) * C1;
  T  = Tm + Ts;

  let f = 1/T;
  let duty = (Tm/T)*100;

  document.getElementById("val-T").innerText = T.toFixed(3);
  document.getElementById("val-f").innerText = f.toFixed(2);
  document.getElementById("val-Tm").innerText = Tm.toFixed(3);
  document.getElementById("val-Ts").innerText = Ts.toFixed(3);
  document.getElementById("val-duty").innerText = duty.toFixed(1);
}

/* -------------------- ANIMATION -------------------- */
function animate(){
  requestAnimationFrame(animate);

  simTime += 0.01;
  let t = simTime % T;
  outputHigh = t < Tm;

  /* LEDs */
  let red = document.getElementById("led-red");
  let green = document.getElementById("led-green");

  if(outputHigh){
    red.style.background = "#f33";
    red.style.boxShadow = "0 0 14px #f33";
    green.style.background = "#030";
    green.style.boxShadow = "0 0 4px #000";
  } else {
    green.style.background = "#3f3";
    green.style.boxShadow = "0 0 14px #3f3";
    red.style.background = "#300";
    red.style.boxShadow = "0 0 4px #000";
  }

  /* WAVEFORM */
  const W = wave.canvas.width;
  const H = wave.canvas.height;

  wave.fillStyle = "black";
  wave.fillRect(0,0,W,H);

  wave.strokeStyle = "#0f0";
  wave.lineWidth = 2;

  wave.beginPath();
  for(let x = 0; x < W; x++){
    let time = (simTime - (W-x)/W*T*2) % T;
    let high = time < Tm;
    let y = high ? 30 : H-30;
    wave.lineTo(x,y);
  }
  wave.stroke();

  /* CAPACITOR CURVE */
  const CH = cap.canvas.height;
  const CW = cap.canvas.width;

  cap.fillStyle = "black";
  cap.fillRect(0,0,CW,CH);

  cap.strokeStyle = "#0af";
  cap.lineWidth = 2;

  cap.beginPath();
  for(let x = 0; x < CW; x++){
    let time = (simTime - (CW-x)/CW*T*2) % T;

    let v;
    if(time < Tm){
      v = 1/3 + (time/Tm)*(1/3);  
    } else {
      v = 2/3 - ((time-Tm)/Ts)*(1/3);
    }

    let y = CH - (v * (CH-20));
    cap.lineTo(x,y);
  }
  cap.stroke();
}
</script>
