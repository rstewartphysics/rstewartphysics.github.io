<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
/* Same theme as National 5 Electronics */
:root {
  --font-stack: "Trebuchet MS","Segoe UI",sans-serif;
  --radius-card: 1rem;
  --shadow-card: 0 24px 48px rgba(0,0,0,0.8);
  --text-main: #ffffff;
  --bg1: #003c2e;
  --bg2: #005f47;
  --bg3: #052a1f;

      --page-accent: #00a878;
      --menu-accent: #00a878;}

body {
  margin: 0;
  background: radial-gradient(circle at 25% 30%, var(--bg1) 0%, var(--bg2) 45%, var(--bg3) 90%);
  background-attachment: fixed;
  color: var(--text-main);
  font-family: var(--font-stack);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  overflow-x: hidden;
}

/* MENU BUTTON */
/* DRAWER */
/* BANNER */
.banner-wrap {
  position: relative;
  width: 100%;
  overflow: hidden;
  box-shadow: 0 6px 15px rgba(0,0,0,0.6);
}
.banner {
  width: 100%;
  max-height: 360px;
  object-fit: cover;
  opacity: 0;
  animation: fadeIn 1.2s forwards;
}
@keyframes fadeIn { to { opacity: 1; } }

.banner-tint {
  position: absolute;
  inset: 0;
  background: linear-gradient(120deg, rgba(0,255,200,0.35), rgba(0,180,255,0.35));
  mix-blend-mode: multiply;
}

.banner-overlay-text {
  position: absolute;
  bottom: 0;
  width: 100%;
  background: rgba(0,0,0,0.45);
  backdrop-filter: blur(8px);
  padding: 1rem;
  text-align: center;
  font-weight: 600;
  font-size: 1.2rem;
}

/* PAGE */
.page-wrap {
  flex: 1;
  width: 100%;
  max-width: 1200px;
  margin: 2rem auto;
  padding: 0 1rem 5rem;
}

/* GRID */
.tile-grid {
  display: grid;
  gap: 1.3rem;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  justify-items: center;
}

/* TILE */
.class-tile {
  position: relative;
  border-radius: var(--radius-card);
  border: 2px solid rgba(255,255,255,0.25);
  outline: 2px solid rgba(255,255,255,0.1);
  outline-offset: -4px;
  box-shadow: inset 0 0 20px rgba(255,255,255,0.05), 0 18px 45px rgba(0,0,0,0.8);
  overflow: hidden;
  aspect-ratio: 1.1/1;
  transform: scale(0.82);
  transition: 0.22s ease;
}
.class-tile:hover {
  transform: scale(0.86) translateY(-3px);
  outline: 3px solid #0ff;
}

.class-tile img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* TRANSPARENT TILE LABEL */
.tile-label {
  position: absolute;
  bottom: 0;
  width: 100%;
  background: rgba(0,0,0,0.45);
  backdrop-filter: blur(6px);
  color: white;
  padding: 0.6rem;
  font-size: 1rem;
  text-align: center;
}
</style>

<!-- MENU BUTTON -->

<!-- BANNER -->
<div class="banner-wrap">

  <div class="banner-tint"></div>

</div>

<!-- PAGE CONTENT -->

      <div class="tile-label">555 Astable</div>
    </a>

    </a>

  </section>
</main>
