<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
/* Same CSS variables and theme as National 5 Electronics */
:root {
  --font-stack: "Trebuchet MS","Segoe UI",sans-serif;
  --radius-card: 1rem;
  --shadow-card: 0 24px 48px rgba(0,0,0,0.8);
  --text-main: #ffffff;
  --bg1: #003c2e;
  --bg2: #005f47;
  --bg3: #052a1f;
}

/* identical styling — copied from N5 Electronics page */
body {
  margin: 0;
  background: radial-gradient(circle at 25% 30%, var(--bg1) 0%, var(--bg2) 45%, var(--bg3) 90%);
  background-attachment: fixed;
  color: var(--text-main);
  font-family: var(--font-stack);
  line-height: 1.5;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  overflow-x: hidden;
}

/* BANNER */
.banner-wrap {
  position: relative;
  width: 100%;
  overflow: hidden;
  flex-shrink: 0;
  box-shadow: 0 6px 15px rgba(0,0,0,0.6);
}
.banner {
  width: 100%;
  height: auto;
  max-height: 360px;
  object-fit: cover;
  display: block;
  opacity: 0;
  animation: fadeIn 1.2s ease forwards;
}
@keyframes fadeIn { to { opacity: 1; } }
@media (max-width: 768px) { .banner { max-height: 260px; } }

.banner-tint {
  position: absolute;
  inset: 0;
  background: linear-gradient(120deg, rgba(0,255,200,0.3), rgba(0,180,255,0.3));
  mix-blend-mode: multiply;
}

.banner-overlay-text {
  position: absolute;
  bottom: 0; left: 0;
  width: 100%;
  background: rgba(0,0,0,0.45);
  backdrop-filter: blur(8px);
  padding: 1rem 0.5rem;
  text-align: center;
  color: white;
  font-weight: 600;
  font-size: 1.2rem;
}

/* GRID + TILES (identical) */
.page-wrap {
  flex: 1;
  width: 100%;
  max-width: 1200px;
  margin: 2rem auto;
  padding: 0 1rem 4rem;
  position: relative;
  z-index: 1;
}

.tile-grid {
  display: grid;
  gap: 1.3rem;
  grid-template-columns: repeat(auto-fit, minmax(190px,1fr));
}

.class-tile {
  display: block;
  border-radius: var(--radius-card);
  border: 2px solid rgba(255,255,255,0.25);
  outline: 2px solid rgba(255,255,255,0.1);
  box-shadow: inset 0 0 20px rgba(255,255,255,0.05), 0 16px 30px rgba(0,0,0,0.7);
  overflow: hidden;
  cursor: pointer;
  transition: 0.2s;
  aspect-ratio: 1.1/1;
}
.class-tile:hover { transform: scale(1.05); outline: 3px solid #0ff; }

.class-tile img { width: 100%; height: 100%; object-fit: cover; }

.visually-hidden {
  position: absolute !important;
  height: 1px; width: 1px;
  clip: rect(1px,1px,1px,1px);
  white-space: nowrap;
}

/* Footer + Menu identical */
footer {
  text-align: center;
  padding: 1rem;
  background: rgba(0,0,0,0.4);
  backdrop-filter: blur(8px);
  margin-top: auto;
}
</style>

</div>
