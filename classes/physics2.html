<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
/* =========================================================
   GLOBAL VARIABLES
   ========================================================= */
:root {
  --font-stack: "Trebuchet MS","Segoe UI",sans-serif;
  --radius-card: 1rem;
  --shadow-card: 0 24px 48px rgba(0,0,0,0.8);

  /* Physics colour palette (consistent with N5/Higher/AH) */
  --phys-bg1: #0e1b38;
  --phys-bg2: #152b63;
  --phys-bg3: #0a1130;

  --text-main: #ffffff;

      --page-accent: #2563eb;
      --menu-accent: #2563eb;}

/* =========================================================
   PAGE BACKGROUND
   ========================================================= */
body {
  margin: 0;
  background: radial-gradient(circle at 25% 30%, var(--phys-bg1), var(--phys-bg2), var(--phys-bg3));
  background-attachment: fixed;
  color: var(--text-main);
  font-family: var(--font-stack);
  line-height: 1.5;
  overflow-x: hidden;
  display: flex;
  min-height: 100vh;
  flex-direction: column;
}

/* =========================================================
   ACCESSIBILITY — VISUALLY HIDDEN
   ========================================================= */
.visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: -1px;
  padding: 0;
  overflow: hidden;
  white-space: nowrap;
  border: 0;
  clip: rect(0 0 0 0);
}

/* =========================================================
   SIDE MENU (iPad-style translucent)
   ========================================================= */
/* =========================================================
   BANNER
   ========================================================= */
.banner-wrap {
  width: 100%;
  overflow: hidden;
  flex-shrink: 0;
  position: relative;
  box-shadow: 0 6px 15px rgba(0,0,0,0.65);
}

.banner {
  width: 100%;
  height: auto;
  max-height: 360px;
  object-fit: cover;
  opacity: 0;
  animation: fadeIn 1.2s ease forwards;
}
@keyframes fadeIn { to { opacity: 1; } }

.banner-tint {
  position: absolute; inset: 0;
  background: linear-gradient(
    120deg,
    rgba(0,180,255,0.28),
    rgba(139,0,255,0.25),
    rgba(255,180,0,0.2)
  );
  mix-blend-mode: multiply;
}

.banner-overlay-text {
  position: absolute;
  bottom: 0; left: 0;
  width: 100%;
  background: rgba(0,0,0,0.45);
  backdrop-filter: blur(8px);
  padding: 1rem 0.5rem;
  text-align: center;
  text-shadow: 0 2px 6px rgba(0,0,0,0.6);
  border-top: 1px solid rgba(255,255,255,0.2);
}
.banner-overlay-text h1 {
  margin: 0;
  font-weight: 600;
  font-size: 1.2rem;
}

/* =========================================================
   TILE GRID
   ========================================================= */
.page-wrap {
  flex: 1;
  max-width: 1200px;
  width: 100%;
  margin: 2rem auto;
  padding: 0 1rem 4rem;
}

.tile-grid {
  display: grid;
  gap: 1.2rem;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
}

/* =========================================================
   TILES
   ========================================================= */
.class-tile {
  display: flex;
  align-items: flex-end;
  justify-content: center;
  min-height: 140px;
  width: 100%;
  border-radius: var(--radius-card);
  background-size: cover;
  background-position: center;
  overflow: hidden;
  box-shadow: var(--shadow-card);
  color: #fff;
  text-decoration: none;
  border: 2px solid rgba(255,255,255,0.15);
  outline-offset: -4px;
  transition: transform 0.18s ease, box-shadow 0.18s ease, filter 0.2s ease;
}
.class-tile:hover,
.class-tile:focus-visible {
  transform: translateY(-4px) scale(1.03);
  box-shadow: 0 30px 60px rgba(0,0,0,0.85);
  outline: 3px solid #fff;
  filter: brightness(1.08);
}

.tile-label {
  width: 100%;
  text-align: center;
  font-weight: 600;
  background: rgba(0,0,0,0.45);
  backdrop-filter: blur(6px);
  padding: 0.55rem 0.4rem;
  border-top: 1px solid rgba(255,255,255,0.2);
}

/* Tile backgrounds */
.tile-s3 { background-image: url("/assets/s3physicsbanner.png"); }
.tile-n5 { background-image: url("/assets/n5physicsbanner.png"); }
.tile-high { background-image: url("/assets/hphysicsbanner.png"); }
.tile-adv { background-image: url("/assets/advbanner.png"); }

/* =========================================================
   FOOTER
   ========================================================= */
footer {
  text-align: center;
  padding: 1rem 0.5rem;
  background: rgba(0,0,0,0.35);
  backdrop-filter: blur(8px);
  border-top: 1px solid rgba(255,255,255,0.15);
  color: #fff;
  font-size: 0.9rem;
}
</style>

<!-- =========================================================
     MENU BUTTON
     ========================================================= -->

<!-- =========================================================
     PAGE BANNER
     ========================================================= -->
<div class="banner-wrap">
  <img src="/assets/physicsbanner.png" alt="Physics banner" class="banner">
  <div class="banner-tint"></div>
  <div class="banner-overlay-text">
    <h1>Discover the Physics Journey — From S3 to Advanced Higher</h1>
  </div>
</div>

<!-- =========================================================

<main class="page-wrap">
  <section class="tile-grid">

    <a class="class-tile tile-s3" href="/classes/s3-physics.html" aria-label="S3 Physics">
      <span class="visually-hidden">S3 Physics</span>
      <div class="tile-label">S3 Physics</div>
    </a>

    <a class="class-tile tile-n5" href="/classes/s3-n5-physics.html" aria-label="National 5 Physics">
      <span class="visually-hidden">National 5 Physics</span>
      <div class="tile-label">National 5 Physics</div>
    </a>

    <a class="class-tile tile-high" href="/classes/higher-physics.html" aria-label="Higher Physics">
      <span class="visually-hidden">Higher Physics</span>
      <div class="tile-label">Higher Physics</div>
    </a>

    <a class="class-tile tile-adv" href="/classes/adv-higher-physics.html" aria-label="Advanced Higher Physics">
      <span class="visually-hidden">Advanced Higher Physics</span>
      <div class="tile-label">Advanced Higher Physics</div>
    </a>

  </section>
</main>

<footer>© Mr R Stewart’s Science, Physics, Electronics & Engineering</footer>
