<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Interactive Relativity Simulation</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f4f4;
    color: #222;
}

header {
    text-align: center;
    padding: 20px 0 10px;
}

#controls {
    padding: 15px;
    background: #eaeaea;
    max-width: 900px;
    margin: 0 auto 20px;
    border-radius: 10px;
    border: 1px solid #ccc;
}

.control-group {
    margin-bottom: 15px;
}

.snap-buttons button {
    margin-right: 6px;
    padding: 6px 10px;
}

canvas {
    background: #000;
    border: 1px solid #666;
}

#container {
    display: flex;
    justify-content: center;
    gap: 30px;
    flex-wrap: wrap;
    padding-bottom: 50px;
}

.panel {
    text-align: center;
}
</style>
</head>

<body>

<header>
    <h1>Interactive Relativity Simulation</h1>
    <p>Explore time dilation and length contraction using the controls below.</p>
</header>

<!-- CONTROL PANEL -->
<div id="controls">

    <div class="control-group">
        <strong>Velocity (fraction of c):</strong><br>
        <input type="range" id="velSlider" min="0" max="0.99" step="0.01" value="0.70">
        <span id="velRead">0.70c</span><br>
        <span id="velMS">2.10 × 10⁸ m/s</span>
    </div>

    <!-- Snap buttons -->
    <div class="control-group snap-buttons">
        <button onclick="snapSpeed(0.50)">0.50c</button>
        <button onclick="snapSpeed(0.70)">0.70c</button>
        <button onclick="snapSpeed(0.90)">0.90c</button>
        <button onclick="snapSpeed(0.99)">0.99c</button>
    </div>

    <div class="control-group">
        <button id="playBtn">Pause</button>
        <button id="resetBtn">Reset</button>
    </div>

    <div class="control-group">
        <label><input type="checkbox" id="showClock" checked> Show Time Dilation</label><br>
        <label><input type="checkbox" id="showShip" checked> Show Length Contraction</label>
    </div>

    <div class="control-group">
        <div id="gammaRead">γ = 1.40</div>
        <div id="properRead">Proper Time (τ): 0.00 s</div>
        <div id="timeRead">Dilated Time (t): 0.00 s</div>
        <div id="lengthRead">Contracted Length: 0.71 L₀</div>
    </div>

</div>

<!-- SIM PANELS -->
<div id="container">
    <div class="panel">
        <canvas id="clock" width="440" height="350"></canvas>
        <div>Light Clock (Time Dilation)</div>
    </div>

    <div class="panel">
        <canvas id="ship" width="550" height="250"></canvas>
        <div>Spaceship (Length Contraction)</div>
    </div>
</div>

<script>
// ---------------------------------------------------------
// CONSTANTS
// ---------------------------------------------------------
const c = 3e8; // speed of light (m/s)

const clock = document.getElementById("clock");
const ctx = clock.getContext("2d");

const ship = document.getElementById("ship");
const sctx = ship.getContext("2d");

let dt = 0.033;
let running = true;

// time counters
let tau = 0;   // proper time
let tDil = 0;  // dilated time

// UI elements
const velSlider = document.getElementById("velSlider");
const velRead = document.getElementById("velRead");
const velMS = document.getElementById("velMS");

const gammaRead = document.getElementById("gammaRead");
const properRead = document.getElementById("properRead");
const timeRead = document.getElementById("timeRead");
const lengthRead = document.getElementById("lengthRead");

// ---------------------------------------------------------
// MATH HELPERS
// ---------------------------------------------------------
function getGamma(v) {
    return 1 / Math.sqrt(1 - v*v);
}

function toMS(v) {
    return v * c;
}

function formatMS(m) {
    return (m/1e8).toFixed(2) + " × 10⁸ m/s";
}

// ---------------------------------------------------------
// SNAP BUTTONS
// ---------------------------------------------------------
function snapSpeed(v) {
    velSlider.value = v;
    updateReadouts();
}

// ---------------------------------------------------------
// UPDATE READOUTS
// ---------------------------------------------------------
function updateReadouts() {
    const v = parseFloat(velSlider.value);
    const gamma = getGamma(v);

    velRead.textContent = v.toFixed(2) + "c";
    velMS.textContent = formatMS(toMS(v));

    gammaRead.textContent = "γ = " + gamma.toFixed(2);
    properRead.textContent = "Proper Time (τ): " + tau.toFixed(2) + " s";
    timeRead.textContent = "Dilated Time (t): " + tDil.toFixed(2) + " s";
    lengthRead.textContent = "Contracted Length: " + (1/gamma).toFixed(2) + " L₀";
}

// ---------------------------------------------------------
// LIGHT CLOCK (IMPROVED PHOTON PATH)
// ---------------------------------------------------------
function drawClock() {
    if (!showClock.checked) {
        ctx.clearRect(0, 0, clock.width, clock.height);
        return;
    }

    const v = parseFloat(velSlider.value);
    const gamma = getGamma(v);

    ctx.clearRect(0, 0, clock.width, clock.height);

    ctx.fillStyle = "white";
    ctx.font = "14px Arial";
    ctx.fillText("Rest Clock (Proper Time τ)", 40, 25);
    ctx.fillText("Moving Clock (Dilated Time t)", 240, 25);

    // Wells
    ctx.strokeStyle = "white";
    ctx.strokeRect(60,50,60,260);
    ctx.strokeRect(260,50,60,260);

    // Photon positions
    let yRest = 50 + (tau * 60) % 260;
    let yMove = 50 + (tDil * 60) % 260;

    // Rest photon (vertical)
    ctx.fillStyle = "cyan";
    ctx.beginPath();
    ctx.arc(90, yRest, 8, 0, 2*Math.PI);
    ctx.fill();

    // Moving photon (diagonal path)
    const horizontalDrift = v * 50; // visual exaggeration factor
    const xMove = 290 + horizontalDrift * tDil;

    // Path line
    ctx.strokeStyle = "rgba(255,255,0,0.4)";
    ctx.beginPath();
    ctx.moveTo(290, 50);
    ctx.lineTo(xMove, yMove);
    ctx.stroke();

    // photon itself
    ctx.fillStyle = "yellow";
    ctx.beginPath();
    ctx.arc(xMove, yMove, 8, 0, 2*Math.PI);
    ctx.fill();
}

// ---------------------------------------------------------
// LENGTH CONTRACTION (unchanged improved)
// ---------------------------------------------------------
function drawShip() {
    if (!showShip.checked) {
        sctx.clearRect(0,0,ship.width,ship.height);
        return;
    }

    const v = parseFloat(velSlider.value);
    const gamma = getGamma(v);

    sctx.clearRect(0,0,ship.width,ship.height);

    const baseX = 60;
    const baseY = 60;
    const baseWidth = 320;
    const h = 40;

    const contracted = baseWidth / gamma;

    // ruler
    const rulerY = baseY + h + 35;
    sctx.strokeStyle = "#444";
    sctx.beginPath();
    sctx.moveTo(baseX - 10, rulerY);
    sctx.lineTo(baseX + baseWidth + 60, rulerY);
    sctx.stroke();

    for (let x = baseX; x <= baseX + baseWidth; x += 20) {
        sctx.beginPath();
        sctx.moveTo(x, rulerY - 5);
        sctx.lineTo(x, rulerY + 5);
        sctx.stroke();
    }

    // rest ship
    sctx.fillStyle = "#4466ff";
    sctx.fillRect(baseX, baseY, baseWidth, h);
    sctx.fillStyle = "white";
    sctx.fillText("Rest length L₀", baseX, baseY - 8);

    // moving ship
    const movingY = baseY + 70;
    sctx.fillStyle = "#ff4444";
    sctx.fillRect(baseX, movingY, contracted, h);
    sctx.fillStyle = "white";
    sctx.fillText("Moving length L = L₀/γ", baseX, movingY - 8);

    sctx.fillText("L/L₀ = " + (1/gamma).toFixed(2),
                  baseX + baseWidth + 10,
                  movingY + h/2 + 5);

    // motion arrow
    const arrowY = movingY + h + 30;
    sctx.beginPath();
    sctx.moveTo(baseX, arrowY);
    sctx.lineTo(baseX + 140, arrowY);
    sctx.stroke();

    sctx.beginPath();
    sctx.moveTo(baseX + 140, arrowY);
    sctx.lineTo(baseX + 130, arrowY - 6);
    sctx.lineTo(baseX + 130, arrowY + 6);
    sctx.fill();

    sctx.fillText("Direction of motion", baseX + 150, arrowY + 5);
}

// ---------------------------------------------------------
// MAIN LOOP
// ---------------------------------------------------------
function animate() {
    if (running) {
        const v = parseFloat(velSlider.value);
        const gamma = getGamma(v);

        tau += dt;
        tDil += dt / gamma;

        updateReadouts();
        drawClock();
        drawShip();
    }

    requestAnimationFrame(animate);
}

animate();

// ---------------------------------------------------------
// UI EVENTS
// ---------------------------------------------------------
velSlider.addEventListener("input", () => {
    updateReadouts();
});

document.getElementById("playBtn").onclick = () => {
    running = !running;
    playBtn.textContent = running ? "Pause" : "Play";
};

document.getElementById("resetBtn").onclick = () => {
    tau = 0;
    tDil = 0;
    updateReadouts();
};

</script>

</body>
</html>
