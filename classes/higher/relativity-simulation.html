<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Interactive Relativity Simulation</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f4f4;
    color: #222;
}

header {
    text-align: center;
    padding: 20px 0 10px;
}

h1 { margin-bottom: 5px; }

#controls {
    padding: 15px;
    background: #eaeaea;
    max-width: 900px;
    margin: 0 auto 20px;
    border-radius: 10px;
    border: 1px solid #ccc;
}

.control-group {
    margin-bottom: 15px;
}

canvas {
    background: #000;
    border: 1px solid #666;
}

#container {
    display: flex;
    justify-content: center;
    gap: 30px;
    flex-wrap: wrap;
    padding-bottom: 50px;
}

.panel {
    text-align: center;
}
</style>
</head>

<body>

<header>
    <h1>Interactive Relativity Simulation</h1>
    <p>Explore time dilation and length contraction using the controls below.</p>
</header>

<!-- CONTROL PANEL -->
<div id="controls">

    <div class="control-group">
        <strong>Velocity (fraction of c):</strong><br>
        <input type="range" id="velSlider" min="0" max="0.99" step="0.01" value="0.45">
        <span id="velRead">0.45c</span>
    </div>

    <div class="control-group">
        <button id="playBtn">Pause</button>
        <button id="resetBtn">Reset</button>
    </div>

    <div class="control-group">
        <label><input type="checkbox" id="showClock" checked> Show Time Dilation</label><br>
        <label><input type="checkbox" id="showShip" checked> Show Length Contraction</label>
    </div>

    <div class="control-group">
        <div id="gammaRead">γ = 1.12</div>
        <div id="timeRead">Dilated Time: 0.00 s</div>
        <div id="lengthRead">Contracted Length: 0.89 L₀</div>
    </div>

</div>

<!-- SIMULATION CANVASES -->
<div id="container">
    <div class="panel">
        <canvas id="clock" width="400" height="330"></canvas>
        <div>Light Clock (Time Dilation)</div>
    </div>

    <div class="panel">
        <canvas id="ship" width="550" height="250"></canvas>
        <div>Spaceship (Length Contraction)</div>
    </div>
</div>

<script>
// ---------------------------------------------------------
// GLOBAL VARIABLES
// ---------------------------------------------------------
const clock = document.getElementById("clock");
const ctx = clock.getContext("2d");

const ship = document.getElementById("ship");
const sctx = ship.getContext("2d");

let t = 0;
let dt = 0.033; // ~30fps for iPad stability
let timeDilated = 0;
let running = true;

// UI elements
const velSlider = document.getElementById("velSlider");
const velRead = document.getElementById("velRead");
const gammaRead = document.getElementById("gammaRead");
const timeRead = document.getElementById("timeRead");
const lengthRead = document.getElementById("lengthRead");
const playBtn = document.getElementById("playBtn");
const resetBtn = document.getElementById("resetBtn");
const showClock = document.getElementById("showClock");
const showShip = document.getElementById("showShip");

// ---------------------------------------------------------
// MATH
// ---------------------------------------------------------
function getGamma(v) {
    return 1 / Math.sqrt(1 - v*v);
}

// ---------------------------------------------------------
// UPDATE READOUTS
// ---------------------------------------------------------
function updateReadouts(v, gamma) {
    velRead.textContent = v.toFixed(2) + "c";
    gammaRead.textContent = "γ = " + gamma.toFixed(2);
    timeRead.textContent = "Dilated Time: " + timeDilated.toFixed(2) + " s";
    lengthRead.textContent = "Contracted Length: " + (1/gamma).toFixed(2) + " L₀";
}

// ---------------------------------------------------------
// DRAW TIME DILATION CLOCK
// ---------------------------------------------------------
function drawClock(v, gamma) {
    if (!showClock.checked) {
        ctx.clearRect(0,0,clock.width,clock.height);
        return;
    }

    ctx.clearRect(0,0,clock.width,clock.height);

    // Clock wells
    ctx.strokeStyle = "white";
    ctx.lineWidth = 2;

    ctx.strokeRect(80,50,60,230);
    ctx.strokeRect(260,50,60,230);

    let yRest = 50 + (t * 60) % 230;
    let yMove = 50 + (t * 60 / gamma) % 230;

    // stationary photon
    ctx.fillStyle = "cyan";
    ctx.beginPath();
    ctx.arc(110, yRest, 8, 0, 2*Math.PI);
    ctx.fill();

    // moving photon
    ctx.fillStyle = "yellow";
    ctx.beginPath();
    ctx.arc(290, yMove, 8, 0, 2*Math.PI);
    ctx.fill();
}

// ---------------------------------------------------------
// DRAW LENGTH CONTRACTION (MUCH IMPROVED VERSION)
// ---------------------------------------------------------
function drawShip(v, gamma) {
    if (!showShip.checked) {
        sctx.clearRect(0,0,ship.width,ship.height);
        return;
    }

    sctx.clearRect(0,0,ship.width,ship.height);

    const baseX = 60;
    const baseY = 60;
    const baseWidth = 320;  // rest length in px
    const thickness = 40;

    // contraction — true physics
    const contracted = baseWidth / gamma;

    // -------------------------------------------------
    // background ruler
    // -------------------------------------------------
    sctx.strokeStyle = "#444";
    sctx.lineWidth = 1;

    // baseline
    const rulerY = baseY + thickness + 35;
    sctx.beginPath();
    sctx.moveTo(baseX - 10, rulerY);
    sctx.lineTo(baseX + baseWidth + 60, rulerY);
    sctx.stroke();

    // tick marks
    for (let x = baseX; x <= baseX + baseWidth; x += 20) {
        sctx.beginPath();
        sctx.moveTo(x, rulerY - 5);
        sctx.lineTo(x, rulerY + 5);
        sctx.stroke();
    }

    // -------------------------------------------------
    // rest ship (blue)
    // -------------------------------------------------
    sctx.fillStyle = "#4466ff";
    sctx.fillRect(baseX, baseY, baseWidth, thickness);

    sctx.fillStyle = "white";
    sctx.font = "14px Arial";
    sctx.fillText("Rest length L₀", baseX, baseY - 10);

    // -------------------------------------------------
    // moving ship (red, contracted)
    // -------------------------------------------------
    const movingY = baseY + 70;

    sctx.fillStyle = "#ff4444";
    sctx.fillRect(baseX, movingY, contracted, thickness);

    sctx.fillStyle = "white";
    sctx.fillText("Moving length L = L₀/γ", baseX, movingY - 10);

    // numeric ratio L/L0
    sctx.fillText("L/L₀ = " + (1/gamma).toFixed(2),
                  baseX + baseWidth + 10,
                  movingY + thickness/2 + 5);

    // -------------------------------------------------
    // direction of motion arrow
    // -------------------------------------------------
    const arrowY = movingY + thickness + 30;

    sctx.beginPath();
    sctx.moveTo(baseX, arrowY);
    sctx.lineTo(baseX + 140, arrowY);
    sctx.stroke();

    sctx.beginPath();
    sctx.moveTo(baseX + 140, arrowY);
    sctx.lineTo(baseX + 130, arrowY - 7);
    sctx.lineTo(baseX + 130, arrowY + 7);
    sctx.closePath();
    sctx.fill();

    sctx.fillText("Direction of motion", baseX + 150, arrowY + 5);
}

// ---------------------------------------------------------
// ANIMATION LOOP
// ---------------------------------------------------------
function animate() {
    if (running) {
        const v = parseFloat(velSlider.value);
        const gamma = getGamma(v);

        t += dt;
        timeDilated += dt / gamma;

        updateReadouts(v, gamma);
        drawClock(v, gamma);
        drawShip(v, gamma);
    }

    requestAnimationFrame(animate);
}

animate();

// ---------------------------------------------------------
// UI EVENTS
// ---------------------------------------------------------
velSlider.addEventListener("input", () => {
    const v = parseFloat(velSlider.value);
    updateReadouts(v, getGamma(v));
});

playBtn.onclick = () => {
    running = !running;
    playBtn.textContent = running ? "Pause" : "Play";
};

resetBtn.onclick = () => {
    t = 0;
    timeDilated = 0;
};
</script>

</body>
</html>
