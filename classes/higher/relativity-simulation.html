<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Higher Physics – Relativity Simulation</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
/* ----------------------------------------------
   GLOBAL DARK BLUE HIGHER THEME
---------------------------------------------- */
body {
    margin: 0;
    font-family: "Trebuchet MS", "Segoe UI", sans-serif;
    background: radial-gradient(circle at 25% 30%, #0e1b38 0%, #152b63 45%, #0a1130 90%);
    background-attachment: fixed;
    color: #fff;
    line-height: 1.5;
}

/* Center the whole page content */
.page-wrap {
    max-width: 1100px;
    margin: 2rem auto;
    padding: 0 1rem 3rem;
}

/* ----------------------------------------------
   HIGHER-STYLE TILE CARDS
---------------------------------------------- */
.card {
    background: linear-gradient(145deg, #0e1b38, #152b63);
    border-radius: 1rem;
    padding: 1.6rem;
    margin-bottom: 2rem;
    box-shadow:
        inset 0 0 22px rgba(255,255,255,0.08),
        0 20px 40px rgba(0,0,0,0.7);
    border: 2px solid rgba(255,255,255,0.18);
    outline: 2px solid rgba(255,255,255,0.1);
    outline-offset: -4px;
}

/* Card headings */
.card h2 {
    margin-top: 0;
    text-align: center;
    font-size: 1.6rem;
    font-weight: 700;
    text-shadow: 0 0 12px rgba(0,255,255,0.6);
}

/* ----------------------------------------------
   CANVAS STYLE (Higher Blue)
---------------------------------------------- */
canvas {
    width: 100%;
    max-width: 520px;
    background: #000;
    border-radius: 12px;
    border: 2px solid rgba(0,255,255,0.2);
    box-shadow: 0 0 18px rgba(0,255,255,0.25);
    display: block;
    margin: 1rem auto;
}

/* ----------------------------------------------
   BUTTONS + SLIDERS (Higher style)
---------------------------------------------- */
button {
    font-family: inherit;
    background: linear-gradient(135deg, #1e3a8a, #4169e1);
    color: #fff;
    padding: 0.6rem 1.2rem;
    margin-right: 0.4rem;
    border-radius: 0.6rem;
    border: 1px solid rgba(255,255,255,0.2);
    box-shadow: 0 0 10px rgba(0,150,255,0.4);
    cursor: pointer;
}

button:hover,
button:focus {
    box-shadow: 0 0 14px rgba(0,200,255,0.8);
    transform: translateY(-2px);
}

input[type=range] {
    width: 80%;
    accent-color: #00e0ff;
    margin-top: 0.5rem;
}

/* Labels beneath canvases */
.panel-label {
    text-align: center;
    margin-top: 0.4rem;
    font-size: 1rem;
}


/* Responsive */
@media (max-width: 700px) {
    canvas {
        max-width: 100%;
    }
}
</style>
</head>

<body>

<div class="page-wrap">

<!-- -----------------------------------------------------
     CONTROL TILE
------------------------------------------------------ -->
<div class="card">
    <h2>Simulation Controls</h2>

    <strong>Velocity:</strong><br>
    <input type="range" id="velSlider" min="0" max="0.99" step="0.01" value="0.70">
    <div>
        <span id="velRead">0.70c</span> —
        <span id="velMS">2.10 × 10⁸ m/s</span>
    </div>

    <div style="margin-top:1rem;">
        <button onclick="snapSpeed(0.50)">0.50c</button>
        <button onclick="snapSpeed(0.70)">0.70c</button>
        <button onclick="snapSpeed(0.90)">0.90c</button>
        <button onclick="snapSpeed(0.99)">0.99c</button>
    </div>

    <div style="margin-top:1rem;">
        <button id="playBtn">Pause</button>
        <button id="resetBtn">Reset</button>
    </div>

    <div style="margin-top:1rem;">
        <label><input type="checkbox" id="showClock" checked> Time Dilation</label><br>
        <label><input type="checkbox" id="showShip" checked> Length Contraction</label>
    </div>

    <div style="margin-top:1rem;">
        <div id="gammaRead">γ = 1.40</div>
        <div id="properRead">Proper Time (τ): 0.00 s</div>
        <div id="timeRead">Dilated Time (t): 0.00 s</div>
        <div id="lengthRead">Contracted Length: 0.71 L₀</div>
    </div>
</div>


<!-- -----------------------------------------------------
     SIMULATION TILE
------------------------------------------------------ -->
<div class="card">
    <h2>Relativity Simulation</h2>

    <canvas id="clock" width="440" height="350"></canvas>
    <div class="panel-label">Light Clock (Time Dilation)</div>

    <canvas id="ship" width="550" height="250"></canvas>
    <div class="panel-label">Spaceship (Length Contraction)</div>
</div>

</div><!-- END PAGE WRAP -->


<script>
/* ----------------------------------------------
   CONSTANTS + SETUP
---------------------------------------------- */
const c = 3e8;

let dt = 0.033;
let running = true;

let tau = 0;   // proper time
let tDil = 0;  // dilated time

// UI
const velSlider = document.getElementById("velSlider");
const velRead = document.getElementById("velRead");
const velMS = document.getElementById("velMS");

const gammaRead = document.getElementById("gammaRead");
const properRead = document.getElementById("properRead");
const timeRead = document.getElementById("timeRead");
const lengthRead = document.getElementById("lengthRead");

/* ----------------------------------------------
   CANVASES
---------------------------------------------- */
const clock = document.getElementById("clock");
const ctx = clock.getContext("2d");

const ship = document.getElementById("ship");
const sctx = ship.getContext("2d");

/* ----------------------------------------------
   MATH UTILITIES
---------------------------------------------- */
function getGamma(v) {
    return 1 / Math.sqrt(1 - v*v);
}

function toMS(v) {
    return v * c;
}

function formatMS(m) {
    return (m/1e8).toFixed(2) + " × 10⁸ m/s";
}

/* ----------------------------------------------
   SNAP BUTTON FUNCTION
---------------------------------------------- */
function snapSpeed(v) {
    velSlider.value = v;
    updateReadouts();
}

/* ----------------------------------------------
   UPDATE READOUTS
---------------------------------------------- */
function updateReadouts() {
    const v = parseFloat(velSlider.value);
    const gamma = getGamma(v);

    velRead.textContent = v.toFixed(2) + "c";
    velMS.textContent = formatMS(toMS(v));

    gammaRead.textContent = "γ = " + gamma.toFixed(2);
    properRead.textContent = "Proper Time (τ): " + tau.toFixed(2) + " s";
    timeRead.textContent = "Dilated Time (t): " + tDil.toFixed(2) + " s";
    lengthRead.textContent = "Contracted Length: " + (1/gamma).toFixed(2) + " L₀";
}

/* ----------------------------------------------
   DRAW TIME DILATION CLOCK – VERTICAL ONLY
---------------------------------------------- */
function drawClock() {
    if (!showClock.checked) {
        ctx.clearRect(0,0,clock.width,clock.height);
        return;
    }

    ctx.clearRect(0,0,clock.width,clock.height);

    ctx.fillStyle = "#fff";
    ctx.font = "15px Trebuchet MS";
    ctx.fillText("Rest Clock (Proper Time τ)", 40, 28);
    ctx.fillText("Moving Clock (Dilated Time t)", 240, 28);

    ctx.strokeStyle = "#fff";
    ctx.strokeRect(60,50,60,260);
    ctx.strokeRect(260,50,60,260);

    // Photon positions
    let yRest = 50 + (tau * 60) % 260;
    let yMove = 50 + (tDil * 60) % 260;

    // Rest photon — cyan glow
    ctx.shadowColor = "rgba(0,255,255,0.6)";
    ctx.shadowBlur = 12;
    ctx.fillStyle = "#00eaff";
    ctx.beginPath();
    ctx.arc(90, yRest, 8, 0, Math.PI*2);
    ctx.fill();

    // Moving photon — purple glow
    ctx.shadowColor = "rgba(190,90,255,0.7)";
    ctx.shadowBlur = 15;
    ctx.fillStyle = "#c060ff";
    ctx.beginPath();
    ctx.arc(290, yMove, 8, 0, Math.PI*2);
    ctx.fill();

    ctx.shadowBlur = 0;
}

/* ----------------------------------------------
   LENGTH CONTRACTION (unchanged improved)
---------------------------------------------- */
function drawShip() {
    if (!showShip.checked) {
        sctx.clearRect(0,0,ship.width,ship.height);
        return;
    }

    const v = parseFloat(velSlider.value);
    const gamma = getGamma(v);

    sctx.clearRect(0,0,ship.width,ship.height);

    const baseX = 60;
    const baseY = 60;
    const baseWidth = 320;
    const h = 40;

    const contracted = baseWidth / gamma;

    // ruler
    const rulerY = baseY + h + 35;
    sctx.strokeStyle = "#3498db";
    sctx.beginPath();
    sctx.moveTo(baseX - 10, rulerY);
    sctx.lineTo(baseX + baseWidth + 60, rulerY);
    sctx.stroke();

    for (let x = baseX; x <= baseX + baseWidth; x += 20) {
        sctx.beginPath();
        sctx.moveTo(x, rulerY - 5);
        sctx.lineTo(x, rulerY + 5);
        sctx.stroke();
    }

    // rest (blue glow)
    sctx.shadowColor = "rgba(0,180,255,0.5)";
    sctx.shadowBlur = 12;
    sctx.fillStyle = "#4466ff";
    sctx.fillRect(baseX, baseY, baseWidth, h);
    sctx.shadowBlur = 0;
    sctx.fillStyle = "#fff";
    sctx.fillText("Rest length L₀", baseX, baseY - 8);

    // moving (red)
    const movingY = baseY + 70;
    sctx.fillStyle = "#ff4444";
    sctx.fillRect(baseX, movingY, contracted, h);
    sctx.fillStyle = "#fff";
    sctx.fillText("Moving length L = L₀/γ", baseX, movingY - 8);

    sctx.fillText("L/L₀ = " + (1/gamma).toFixed(2),
                  baseX + baseWidth + 10,
                  movingY + h/2 + 5);

    // motion arrow
    const arrowY = movingY + h + 30;
    sctx.beginPath();
    sctx.moveTo(baseX, arrowY);
    sctx.lineTo(baseX + 140, arrowY);
    sctx.stroke();

    sctx.beginPath();
    sctx.moveTo(baseX + 140, arrowY);
    sctx.lineTo(baseX + 130, arrowY - 6);
    sctx.lineTo(baseX + 130, arrowY + 6);
    sctx.fill();

    sctx.fillText("Direction of motion", baseX + 150, arrowY + 5);
}

/* ----------------------------------------------
   MAIN LOOP
---------------------------------------------- */
function animate() {
    if (running) {
        const v = parseFloat(velSlider.value);
        const gamma = getGamma(v);

        tau += dt;
        tDil += dt / gamma;

        updateReadouts();
        drawClock();
        drawShip();
    }

    requestAnimationFrame(animate);
}

animate();

/* ----------------------------------------------
   UI EVENTS
---------------------------------------------- */
velSlider.addEventListener("input", updateReadouts);

document.getElementById("playBtn").onclick = () => {
    running = !running;
    playBtn.textContent = running ? "Pause" : "Play";
};

document.getElementById("resetBtn").onclick = () => {
    tau = 0;
    tDil = 0;
    updateReadouts();
};

</script>

</body>
</html>
