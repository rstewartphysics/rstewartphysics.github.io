<title>Circuit Conversion Trainer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: a workbench — diagram and notes on the left, the board on the right, one step at a time. */
:root {
  --bg: #eaf6f1; --surface: #ffffff; --surface-2: #f3faf7; --paper: #fbfdfc;
  --ink: #10261f; --muted: #4a635b; --line: #cde3da;
  --accent: #087561; --accent-fill: #0a9d7f; --on-accent: #ffffff;
  --step: #d97706; --step-ink: #9a4d05; --step-soft: #fdf1e1;
  --trace: #1d6fa5; --trace-soft: #e5f0f9;
  --good: #15803d; --good-soft: #e6f5ec; --bad: #b42318; --bad-soft: #fdecea;
  --font: "Trebuchet MS", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 12px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #06140f; --surface: #0d2019; --surface-2: #12291f; --paper: #f4f9f6;
  --ink: #e3f3ec; --muted: #9dbab0; --line: #24423a;
  --accent: #3ddbb3; --accent-fill: #0a9d7f; --on-accent: #ffffff;
  --step: #f59e0b; --step-ink: #f5b562; --step-soft: #2a1d08;
  --trace: #7cc0f0; --trace-soft: #0f2536;
  --good: #5dd693; --good-soft: #0f2a1b; --bad: #ff8f84; --bad-soft: #2d1210;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #06140f; --surface: #0d2019; --surface-2: #12291f; --paper: #f4f9f6;
  --ink: #e3f3ec; --muted: #9dbab0; --line: #24423a;
  --accent: #3ddbb3; --accent-fill: #0a9d7f; --on-accent: #ffffff;
  --step: #f59e0b; --step-ink: #f5b562; --step-soft: #2a1d08;
  --trace: #7cc0f0; --trace-soft: #0f2536;
  --good: #5dd693; --good-soft: #0f2a1b; --bad: #ff8f84; --bad-soft: #2d1210;
  color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.5;
  -webkit-font-smoothing: antialiased; margin: 0; }
.wrap { max-width: 1240px; margin: 0 auto; padding-block: 18px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1 { font-size: 1.55rem; margin: 0; font-weight: 900; text-wrap: balance; }
.sub { margin: .2rem 0 0; color: var(--muted); font-weight: 700; max-width: 70ch; }
button { font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--trace); outline-offset: 2px; }

.bar { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; margin-top: 14px; }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); padding: 3px; gap: 3px; }
.seg button { border: 0; background: transparent; border-radius: 999px; padding: .5rem .9rem; min-height: 44px; font-weight: 800; cursor: pointer; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent-fill); color: var(--on-accent); }
.seg button .lvl { display: block; font-size: .72rem; font-weight: 700; opacity: .85; line-height: 1.1; }
.parts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; border-bottom: 2px solid var(--line); }
.parts button { border: 0; background: transparent; padding: .6rem .85rem; min-height: 44px; font-weight: 800; color: var(--muted); cursor: pointer;
  border-bottom: 3px solid transparent; margin-bottom: -2px; }
.parts button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent-fill); }

.mode { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; font-weight: 700; color: var(--muted); font-size: .93rem; }
.chip { display: inline-block; padding: .15rem .6rem; border-radius: 999px; font-size: .78rem; font-weight: 900; letter-spacing: .03em; text-transform: uppercase; }
.chip.worked { background: var(--good-soft); color: var(--good); }
.chip.faded { background: var(--step-soft); color: var(--step-ink); }
.chip.yours { background: var(--trace-soft); color: var(--trace); }
.toggle { display: inline-flex; align-items: center; gap: .45rem; font-weight: 800; color: var(--ink); cursor: pointer; min-height: 44px; }
.toggle input { width: 20px; height: 20px; accent-color: var(--accent-fill); }

.stephead { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; margin: 14px 0 10px; }
.stephead h2 { font-size: 1.15rem; margin: 0; font-weight: 900; text-wrap: balance; }
.stephead h2 .n { display: inline-grid; place-items: center; min-width: 1.8em; height: 1.8em; border-radius: 999px; background: var(--accent-fill); color: var(--on-accent);
  font-size: .85rem; margin-right: .45rem; vertical-align: 2px; font-variant-numeric: tabular-nums; }
.nav { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.nav button.go { min-height: 44px; min-width: 44px; padding: .45rem 1rem; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-weight: 900; cursor: pointer; }
.nav button.go.primary { background: var(--accent-fill); color: var(--on-accent); border-color: transparent; }
.nav button.go:disabled { opacity: .4; cursor: default; }
.dots { display: flex; flex-wrap: wrap; gap: 5px; }
.dots button { width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); font-size: .72rem; font-weight: 900; cursor: pointer; padding: 0; color: var(--muted); }
.dots button[aria-current="step"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

.stage { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 14px; align-items: start; }
.stage.solo { grid-template-columns: minmax(0, 4fr) minmax(0, 6fr); }
.col { display: grid; gap: 12px; min-width: 0; }
.fig { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); padding: 10px; overflow-x: auto; }
.fig svg { display: block; width: 100%; height: auto; }
.fig .cap { margin: .35rem 0 0; font-size: .82rem; font-weight: 800; color: #4a635b; }
.board svg { cursor: crosshair; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; min-width: 0; }
.card p { margin: 0 0 .55rem; }
.card p:last-child { margin-bottom: 0; }
.lead { font-weight: 800; }
.how { color: var(--muted); font-weight: 700; }
.ask { border: 2px solid var(--step); background: var(--step-soft); border-radius: var(--r); padding: 10px 12px; }
.ask .q { font-weight: 900; margin: 0 0 .35rem; }
.ask .q .nn { margin-right: .3rem; }
.fb { margin-top: .45rem; padding: .5rem .65rem; border-radius: 10px; font-weight: 700; }
.fb.good { background: var(--good-soft); color: var(--good); }
.fb.bad { background: var(--bad-soft); color: var(--bad); }
.fb.fair { background: var(--trace-soft); color: var(--trace); }
.btnrow { display: flex; flex-wrap: wrap; gap: 8px; margin-top: .5rem; }
.btn { min-height: 44px; padding: .45rem .9rem; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-weight: 800; cursor: pointer; }
.btn.primary { background: var(--accent-fill); color: var(--on-accent); border-color: transparent; }
.nets { list-style: none; padding: 0; margin: .4rem 0 0; display: grid; gap: .35rem; font-weight: 700; color: var(--muted); }
.nets b { color: var(--ink); }
.nn { display: inline-grid; place-items: center; width: 1.6em; height: 1.6em; border-radius: 50%; background: var(--step); color: #fff; font-weight: 900; font-size: .78rem; flex: none; }
.netref { border-bottom: 3px solid; padding-bottom: 1px; white-space: nowrap; }
.tracebox { font-weight: 700; color: var(--muted); font-size: .93rem; }
.tracebox b { color: var(--ink); }
.pins { display: flex; flex-wrap: wrap; gap: 6px; margin-top: .4rem; }
.pins button { min-height: 40px; min-width: 40px; padding: .3rem .6rem; border-radius: 9px; border: 1px solid var(--line); background: var(--surface-2); font-weight: 900; cursor: pointer; font-variant-numeric: tabular-nums; }
.pins button[aria-pressed="true"] { background: var(--trace); color: #fff; border-color: transparent; }
.small { font-size: .85rem; color: var(--muted); font-weight: 700; }
details.hint summary { cursor: pointer; font-weight: 900; color: var(--accent); min-height: 32px; }
table.nt { width: 100%; border-collapse: collapse; margin-top: .4rem; font-size: .92rem; }
table.nt th, table.nt td { border-bottom: 1px solid var(--line); padding: .35rem .3rem; text-align: left; vertical-align: middle; }
table.nt th { font-size: .78rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
table.nt input { width: 100%; min-width: 6.5rem; min-height: 40px; padding: .3rem .5rem; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); font: inherit; font-weight: 800; }
table.nt td.ok input { border-color: var(--good); background: var(--good-soft); }
table.nt td.no input { border-color: var(--bad); background: var(--bad-soft); }
.tblwrap { overflow-x: auto; }
.opts { display: grid; gap: 8px; margin-top: .5rem; }
.opt { text-align: left; padding: .6rem .8rem; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); font-weight: 800; cursor: pointer; min-height: 44px; }
.opt.right { border-color: var(--good); background: var(--good-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.score { font-weight: 900; margin-top: .6rem; }
.qcard + .qcard { margin-top: 12px; }
.mtabs { display: flex; gap: 6px; flex-wrap: wrap; }
.cur .sbd-wire, .cur .sbd-pos, .cur .sbd-part, .cur polyline, .cur line, .cur path, .cur rect.sbd-part { stroke: #d97706 !important; }
.cur .sbd-node, .cur polygon.sbd-node { fill: #d97706 !important; }
.cur .sbd-clab, .cur .sbd-poslab { fill: #9a4d05 !important; }
g.ring { cursor: pointer; }
@media (max-width: 860px) { .stage, .stage.solo { grid-template-columns: minmax(0, 1fr); } }
@media (min-width: 861px) {
  .board svg { max-height: calc(100vh - 250px); width: auto; max-width: 100%; margin: 0 auto; }
}
@media (min-width: 861px) and (max-height: 900px) {
  .wrap { padding-block: 10px 32px; }
  h1 { font-size: 1.25rem; display: inline; margin-right: 12px; }
  header { display: flex; align-items: baseline; flex-wrap: wrap; }
  .sub { display: none; }
  .bar { margin-top: 8px; }
  .parts { margin-top: 6px; }
  .parts button { min-height: 40px; padding: .4rem .7rem; }
  .mode { margin-top: 6px; font-size: .86rem; }
  .stephead { margin: 8px 0 8px; }
  .seg button { min-height: 40px; padding: .35rem .8rem; }
}
@media (max-width: 560px) { .dots { display: none; } .parts button { padding: .5rem .55rem; font-size: .92rem; } table.nt input { min-width: 4.5rem; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<div class="wrap">
  <header>
    <h1>Circuit Conversion Trainer</h1>
    <p class="sub">Turn a circuit diagram into a breadboard and a stripboard layout, one step at a time. The help fades from the first circuit to the third.</p>
  </header>
  <div class="bar">
    <div class="seg" role="group" aria-label="Circuit" id="circuits"></div>
  </div>
  <div class="parts" role="tablist" aria-label="Part" id="parts"></div>
  <div class="mode" id="mode"></div>
  <main id="main"></main>
</div>

<script>/*ENGINE*/</script>
<script>/*DATA*/</script>
<script>
(function () {
  "use strict";
  var S = window.SBD, R = S.render, G = window.GUIDES;
  var st = document.createElement("style"); st.textContent = R.STYLE; document.head.appendChild(st);

  var PARTS = [["diagram", "1 · Circuit diagram"], ["bread", "2 · Diagram → breadboard"], ["strip", "3 · Diagram → stripboard"],
               ["mistake", "Spot the mistake"], ["quiz", "Quick quiz"]];
  var LEVEL = { worked: "Worked example", faded: "Some steps yours", yours: "Your turn" };
  var state = { ci: 0, part: "diagram", step: 0, tryFirst: false, prompts: null, focusNet: 0, focusPin: null, mi: 0, picked: {}, quiz: {} };
  try { var saved = JSON.parse(localStorage.getItem("cct-v1") || "{}"); if (saved.tryFirst) state.tryFirst = true; } catch (e) {}

  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;"); };
  var circ = function () { return G[state.ci]; };

  /* ------------------------------------------------- board helpers */
  function stepOf(x) { return Array.isArray(x) ? x[1] : x.step; }
  function attemptUpTo(ref, k) {
    var num = 0, ok = function (x) { return stepOf(x) <= k; };
    return {
      cuts: ref.cuts.filter(ok).map(function (x) { return x[0]; }),
      placements: ref.placements.filter(ok).map(function (p) { return { id: p.id, footprint: p.footprint, at: p.at, rot: p.rot || 0 }; }),
      links: ref.links.map(function (l) { return { a: l.a, b: l.b, colour: l.colour, num: ++num, step: l.step }; }).filter(ok),
      testpoints: ref.testpoints.filter(ok).map(function (t) { return { id: t.id, at: t.at }; })
    };
  }
  function holesOfStep(ref, k) {
    var out = [], ok = function (x) { return stepOf(x) === k; };
    ref.placements.filter(ok).forEach(function (p) {
      S.cellsOf(S.FOOTPRINTS[p.footprint], S.parseRef(p.at), p.rot || 0).pins.forEach(function (z) { out.push(z.hole); });
    });
    ref.links.filter(ok).forEach(function (l) { out.push(S.parseRef(l.a), S.parseRef(l.b)); });
    ref.testpoints.filter(ok).forEach(function (t) { out.push(S.parseRef(t.at)); });
    ref.cuts.filter(ok).forEach(function (x) { out.push(S.parseRef(x[0])); });
    return out;
  }
  /* every net keeps one colour everywhere: diagram ring, board band, text chip */
  function netCol(c, n) { return c.netColours[n - 1]; }
  function inkOn(hex) {
    var v = parseInt(hex.slice(1), 16), r = v >> 16, g = (v >> 8) & 255, b = v & 255;
    return (0.299 * r + 0.587 * g + 0.114 * b) > 150 ? "#1a1a1a" : "#ffffff";
  }
  /* "net 3" in running text gets its net's colour as an underline */
  function netRefs(c, html) {
    return html.replace(/\bnet (\d+)/g, function (m, d) { var col = c.netColours[+d - 1]; return col ? '<span class="netref" style="border-color:' + col + '">' + m + "</span>" : m; });
  }
  function nnChip(c, n) { var col = netCol(c, n); return '<span class="nn" style="background:' + col + ";color:" + inkOn(col) + '">' + n + "</span>"; }
  function bandSVG(c, K, netNums, focus) {
    var s = "", used = {};
    K.used.forEach(function (k) { used[k] = 1; });
    netNums.forEach(function (n) {
      var colour = netCol(c, n), ink = inkOn(colour);
      K.nets[n - 1].forEach(function (node) {
        var hs = K.nodes[node].holes;
        var a = R.centreOf(hs[0][0], hs[0][1], K.board), b = R.centreOf(hs[hs.length - 1][0], hs[hs.length - 1][1], K.board), p = R.P * 0.46;
        s += '<rect x="' + (a.x - p) + '" y="' + (a.y - p) + '" width="' + (b.x - a.x + 2 * p) + '" height="' + (b.y - a.y + 2 * p) + '" rx="' + p +
             '" fill="' + colour + '" fill-opacity="' + (focus ? 0.18 : 0.3) + '" stroke="' + colour + '" stroke-width="' + (focus ? 3.5 : 2.2) + '"' +
             (focus ? ' stroke-dasharray="7 4"' : "") + ' pointer-events="none"/>';
        var free = hs.find(function (h) { return !used[h[0] * 1000 + h[1]]; }) || hs[0];
        var f = R.centreOf(free[0], free[1], K.board);
        s += '<g pointer-events="none"><circle cx="' + f.x + '" cy="' + f.y + '" r="9" fill="' + colour + '" stroke="#fff" stroke-width="1.5"/><text x="' + f.x + '" y="' + (f.y + 4) +
             '" text-anchor="middle" font-size="11" font-weight="900" fill="' + ink + '" font-family="Trebuchet MS, sans-serif">' + n + '</text></g>';
      });
    });
    return s;
  }
  function boardSVG(c, K, attempt, opts) {
    opts = opts || {};
    var svg = R.renderBoard({ board: K.board, question: K.question, attempt: attempt, marks: opts.marks || [] });
    var extra = bandSVG(c, K, opts.bands || [], false) + (opts.focusNet ? bandSVG(c, K, [opts.focusNet], true) : "");
    svg = svg.replace("</svg>", extra + "</svg>").replace(/ width="[\d.]+" height="[\d.]+"/, "");
    if (K.viewBox) svg = svg.replace(/viewBox="[^"]+"/, 'viewBox="' + K.viewBox + '"');
    return svg.replace("<svg ", '<svg aria-label="' + (K.isBread ? "Breadboard" : "Stripboard") + ' layout. Tap a hole to find its net." ');
  }
  function holeFromEvent(K, svg, e) {
    var pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
    var p = pt.matrixTransform(svg.getScreenCTM().inverse());
    return R.holeAt(K.board, p.x, p.y);
  }
  function netOfHole(K, h) {
    var node = K.holeNode[h.r * 1000 + h.c];
    if (node === undefined) return 0;
    for (var i = 0; i < K.nets.length; i++) if (K.nets[i].indexOf(node) >= 0) return i + 1;
    return 0;
  }
  function netWhere(K, n) { return K.nets[n - 1].map(function (id) { return K.nodes[id].name; }).join(", "); }
  function unit(K) { return K.isBread ? "column" : "track"; }

  /* -------------------------------------------------- diagram */
  function diagramSVG(c, o) {
    var d = c.diagram, upto = o.upto == null ? d.groups.length : o.upto, body = "";
    for (var i = 0; i < upto; i++) body += ((o.cur || []).indexOf(i + 1) >= 0 || (o.chipOn && i === 0)) ? '<g class="cur">' + d.groups[i] + "</g>" : "<g>" + d.groups[i] + "</g>";
    if (o.rings) d.netPos.forEach(function (p, i) {
      var n = i + 1;
      if (Array.isArray(o.rings) && o.rings.indexOf(n) < 0) return;
      var col = c.netColours[i], ink = inkOn(col), on = (o.on || []).indexOf(n) >= 0, foc = o.focus === n;
      body += '<g class="ring" data-net="' + n + '" role="button" tabindex="0" aria-label="Net ' + n + '">' +
              '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="13" fill="transparent"/>' +
              (on ? '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="12.5" fill="none" stroke="' + col + '" stroke-width="2.5"/>' : "") +
              (foc ? '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="13" fill="none" stroke="' + col + '" stroke-width="2.5" stroke-dasharray="4 3"/>' : "") +
              '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="8.5" fill="' + col + '" stroke="#fff" stroke-width="1.2"/>' +
              '<text x="' + p[0] + '" y="' + (p[1] + 3.6) + '" text-anchor="middle" font-size="10.5" font-weight="900" fill="' + ink + '" font-family="Trebuchet MS, sans-serif">' + n + "</text></g>";
    });
    if (o.curPin && d.pins[o.curPin]) {
      var cp = d.pins[o.curPin];
      body += '<circle cx="' + cp[0] + '" cy="' + cp[1] + '" r="9" fill="#d97706" fill-opacity="0.25" stroke="#d97706" stroke-width="2.5"/>';
    }
    if (o.pin && d.pins[o.pin]) {
      var q = d.pins[o.pin];
      body += '<circle cx="' + q[0] + '" cy="' + q[1] + '" r="10" fill="none" stroke="#1d6fa5" stroke-width="3"/>';
    }
    return '<svg viewBox="0 0 ' + d.w + " " + d.h + '" role="img" aria-label="' + esc(c.short) + ' circuit diagram">' + body + "</svg>";
  }

  /* --------------------------------------------- conversion steps */
  function promptsFor(c, s) {
    var mode = c.mode;
    if (!s.prompts.length) return null;
    if (mode === "worked" && !state.tryFirst) return null;
    if (mode === "faded") {
      if (s.type === "chip") return null;
      var list = s.prompts.filter(function (p) { return p.part || !s.pin; });
      return list.length ? list : null;
    }
    return s.prompts.slice();
  }

  /* --------------------------------------------------- rendering */
  function renderTop() {
    $("circuits").innerHTML = G.map(function (c, i) {
      return '<button type="button" data-ci="' + i + '" aria-pressed="' + (i === state.ci) + '">' + esc(c.short) + '<span class="lvl">' + LEVEL[c.mode] + "</span></button>";
    }).join("");
    $("parts").innerHTML = PARTS.map(function (p) {
      return '<button type="button" role="tab" data-part="' + p[0] + '" aria-selected="' + (p[0] === state.part) + '">' + p[1] + "</button>";
    }).join("");
    var c = circ(), txt = c.mode === "worked" ? "Follow each step. For a challenge, try each step yourself first."
      : c.mode === "faded" ? "On the parts steps, tap where each net goes before the answer shows."
      : "Tap where each net goes. Open a hint if you are stuck.";
    $("mode").innerHTML = '<span class="chip ' + c.mode + '">' + LEVEL[c.mode] + "</span><span>" + txt + "</span>" +
      (c.mode === "worked" && (state.part === "bread" || state.part === "strip") ?
        '<label class="toggle"><input type="checkbox" id="tryFirst"' + (state.tryFirst ? " checked" : "") + "> Try each step first</label>" : "");
  }

  function stepHead(n, total, title) {
    var dots = "";
    for (var i = 0; i < total; i++) dots += '<button type="button" data-go="' + i + '" aria-label="Step ' + (i + 1) + '"' + (i === n ? ' aria-current="step"' : "") + ">" + (i + 1) + "</button>";
    return '<div class="stephead"><h2><span class="n">' + (n + 1) + "</span>" + esc(title) + "</h2>" +
      '<div class="nav"><button type="button" class="go" data-step="-1"' + (n === 0 ? " disabled" : "") + ' aria-label="Back">◀ Back</button>' +
      '<div class="dots">' + dots + "</div>" +
      '<button type="button" class="go primary" data-step="1"' + (n === total - 1 ? " disabled" : "") + ' aria-label="Next">Next ▶</button></div></div>';
  }

  function renderDiagramPart() {
    var c = circ(), n = state.step, s = c.steps[n];
    $("main").innerHTML = stepHead(n, c.steps.length, s.title) +
      '<div class="stage solo"><div class="col"><div class="card"><p class="lead">' + s.circuit + "</p>" +
      '<p class="small">Orange shows what this step adds. Every part has an ID (R1, C1, IC1) that the layout will use.</p></div></div>' +
      '<div class="col"><div class="fig">' + diagramSVG(c, { upto: n + 1, cur: [n + 1] }) + "</div></div></div>";
  }

  function renderConvert(kind) {
    var c = circ(), K = c.kinds[kind], steps = K.seq, n = Math.min(state.step, steps.length - 1), s = steps[n];
    if (!state.prompts || state.prompts.key !== kind + n + c.id) {
      var list = promptsFor(c, s);
      state.prompts = { key: kind + n + c.id, list: list, i: 0, done: [], fb: null, revealed: !list };
    }
    var P = state.prompts, revealed = P.revealed;
    var k = s.type === "check" ? 99 : n;
    var boardK = revealed ? k : Math.max(0, k - 1);
    var att = attemptUpTo(K.reference, boardK);
    if (!revealed && P.list[P.i].pin) {
      var full = attemptUpTo(K.reference, 0);
      att.placements = full.placements; att.cuts = full.cuts; boardK = 0;
    }
    var marks = revealed && k < 99 ? holesOfStep(K.reference, k).map(function (h) { return { r: h.r, c: h.c, kind: "hl" }; }) : [];
    if (state.focusPin && K.pinHoles["IC1." + state.focusPin]) {
      var ph = K.pinHoles["IC1." + state.focusPin]; marks.push({ r: ph[0], c: ph[1], kind: "hl2" });
    }
    var bandNets = s.type === "net" ? (revealed ? [s.net] : P.done.filter(function (x) { return x; })) : [];
    var board = boardSVG(c, K, att, { marks: marks, bands: bandNets, focusNet: state.focusNet });

    /* the nets numbered so far, in the order the pupil met them */
    var upto = s.type === "net" ? K.order.indexOf(s.net) + (revealed ? 1 : 0) : (s.type === "chip" ? 0 : K.order.length);
    var shown = K.order.slice(0, upto);
    if (s.type === "net" && !revealed && P.list[P.i].part) shown = K.order.slice(0, K.order.indexOf(s.net) + 1);
    var dia = diagramSVG(c, { rings: shown, on: s.type === "net" && shown.indexOf(s.net) >= 0 ? [s.net] : [],
      focus: state.focusNet, pin: state.focusPin, curPin: s.pin || (s.type === "chip" ? null : null), chipOn: s.type === "chip" });

    var hideHow = c.mode === "yours" && !revealed;
    var ask = "";
    var text = '<div class="card"><p class="lead">' + netRefs(c, s.lead) + "</p>" +
      (hideHow ? '<details class="hint"><summary>Hint</summary><p class="how">' + netRefs(c, s.how) + "</p></details>" : '<p class="how">' + netRefs(c, s.how) + "</p>");
    if (revealed && s.items.length) text += '<ul class="nets">' + s.items.map(function (t) { return "<li>" + netRefs(c, esc(t)) + "</li>"; }).join("") + "</ul>";
    text += "</div>";

    if (!revealed) {
      var pr = P.list[P.i], q;
      if (pr.pin) q = '<p class="q">' + esc(pr.text) + "</p>";
      else if (pr.part) q = '<p class="q">' + nnChip(c, pr.net) + esc(pr.text) + "</p>";
      else q = '<p class="q">' + nnChip(c, pr.net) + (s.pin ? "Pin " + s.pin + " is on net " + pr.net + ". Tap any hole in the " + unit(K) + " net " + pr.net + " goes in."
        : "Net " + pr.net + " joins " + esc(c.netParts[pr.net - 1].join(", ")) + ". Tap the " + unit(K) + " you would give it.") + "</p>";
      ask = '<div class="ask" aria-live="polite">' + q + '<p class="small">Question ' + (P.i + 1) + " of " + P.list.length + ". The answer shows when you get it.</p>" +
        (P.fb ? '<div class="fb ' + P.fb[0] + '">' + P.fb[1] + "</div>" : "") +
        '<div class="btnrow"><button type="button" class="btn" id="showMe">Show me</button></div></div>';
    } else if (P.fb) {
      ask = '<div class="fb ' + P.fb[0] + '" aria-live="polite">' + P.fb[1] + "</div>";
    }
    if (s.type === "check") text += netTable(c, K);

    var traceTxt = state.focusNet ? nnChip(c, state.focusNet) + " Net " + state.focusNet + ": " + esc(c.netParts[state.focusNet - 1].join(", ")) +
      " <b>→ " + esc(netWhere(K, state.focusNet)) + "</b>" : "Tap a net number on the diagram, or a hole on the board, to see the same net in both.";
    var pinTxt = "";
    if (state.focusPin) {
      var ph2 = K.pinHoles["IC1." + state.focusPin], drawn = !!c.diagram.pins[state.focusPin];
      pinTxt = "<b>Pin " + state.focusPin + ": " + esc(c.pinNames[state.focusPin]) + ".</b> " +
        (drawn ? "Ringed on the diagram. " : "Not drawn on the diagram, because it isn't used. ") +
        "On the board it is hole " + esc(S.holeName(S.BOARDS[K.board], { r: ph2[0], c: ph2[1] })) + ".";
    }
    var tools = '<div class="card tracebox"><p>' + traceTxt + '</p><p class="small" style="margin-top:.4rem">Find a pin of the ' + esc(c.chip) +
      ": the symbol's pin order is not the chip's.</p><div class=\"pins\" role=\"group\" aria-label=\"" + esc(c.chip) + ' pins">' +
      [1, 2, 3, 4, 5, 6, 7, 8].map(function (p) { return '<button type="button" data-pin="' + p + '" aria-pressed="' + (String(state.focusPin) === String(p)) + '">' + p + "</button>"; }).join("") +
      "</div>" + (pinTxt ? '<p style="margin-top:.4rem">' + pinTxt + "</p>" : "") + "</div>";

    $("main").innerHTML = stepHead(n, steps.length, s.title) +
      '<div class="stage"><div class="col">' + ask + '<div class="fig">' + dia +
      '<p class="cap">Circuit diagram' + (shown.length ? ", nets numbered so far" : "") + "</p></div>" + text + "</div>" +
      '<div class="col"><div class="fig board" id="boardFig">' + board + '<p class="cap">' + (K.isBread ? "Breadboard, half size (400 holes)" : "Stripboard, tracks run across") +
      (revealed ? "" : " · tap the board to answer") + "</p></div>" + tools + "</div></div>";
    var svg = $("boardFig").querySelector("svg");
    svg.addEventListener("click", function (e) { boardTap(c, K, s, holeFromEvent(K, svg, e), boardK); });
  }

  function netTable(c, K) {
    var rows = c.target.map(function (_, i) {
      var n = i + 1;
      return '<tr><td>' + nnChip(c, n) + "</td><td>" + esc(c.netParts[i].join(", ")) + '</td><td data-net="' + n + '"><input id="nt-' + c.id + "-" + K.board + "-" + n +
        '" aria-label="Net ' + n + " " + unit(K) + '" placeholder="' + (K.isBread ? "e.g. 12 or +" : "e.g. G") + '"></td></tr>';
    }).join("");
    return '<div class="card"><p class="lead">Fill in the net table</p><p class="small">For each net, write its ' + (K.isBread ? "column number(s), or + / − for a rail" : "track letter(s)") +
      ". Separate two with a comma.</p><div class=\"tblwrap\"><table class=\"nt\"><thead><tr><th>Net</th><th>What's in it</th><th>" + (K.isBread ? "Column" : "Track") + "</th></tr></thead><tbody>" + rows +
      '</tbody></table></div><div class="btnrow"><button type="button" class="btn primary" id="ntCheck">Check my table</button><button type="button" class="btn" id="ntShow">Show answers</button></div><p class="fb" id="ntFb" hidden aria-live="polite"></p></div>';
  }
  function tokensOf(K, n) {
    var set = {};
    K.nets[n - 1].forEach(function (id) { set[K.nodes[id].token] = 1; });
    return Object.keys(set);
  }
  function checkTable(show) {
    var c = circ(), K = c.kinds[state.part], right = 0;
    c.target.forEach(function (_, i) {
      var n = i + 1, td = document.querySelector('td[data-net="' + n + '"]'), inp = td.querySelector("input"), want = tokensOf(K, n);
      if (show) { inp.value = want.join(", "); td.className = "ok"; right++; return; }
      var got = inp.value.toUpperCase().replace(/-/g, "−").split(/[^A-Z0-9+−]+/).filter(Boolean);
      var uniq = got.filter(function (v, j) { return got.indexOf(v) === j; });
      var ok = uniq.length === want.length && uniq.every(function (t) { return want.indexOf(t) >= 0; });
      td.className = ok ? "ok" : "no"; if (ok) right++;
    });
    var fb = $("ntFb"); fb.hidden = false;
    fb.className = "fb " + (right === c.target.length ? "good" : "bad");
    fb.textContent = show ? "Answers filled in. Compare them with the board." :
      right === c.target.length ? "Right. Every net is accounted for." : right + " of " + c.target.length + " right. A red row is missing a " + unit(K) + " or has one that belongs to another net.";
  }

  function boardTap(c, K, s, h, boardK) {
    if (!h) return;
    var P = state.prompts;
    if (P && !P.revealed) {
      var pr = P.list[P.i], got = netOfHole(K, h);
      var placed = function (id) { return (K.placedStep[id] == null ? 99 : K.placedStep[id]) <= boardK; };
      var netOnBoard = function (m) { return P.done.indexOf(m) >= 0 || K.order.indexOf(m) < K.order.indexOf(s.net) || (s.net === m && P.done.indexOf(m) >= 0); };
      if (pr.pin) {
        var want = K.pinHoles["IC1." + pr.pin];
        if (want[0] === h.r && want[1] === h.c) { P.fb = ["good", "Right. That's pin " + pr.pin + ": " + c.pinNames[pr.pin] + "."]; advance(); }
        else {
          var other = Object.keys(K.pinHoles).find(function (k) { return k.indexOf("IC1.") === 0 && K.pinHoles[k][0] === h.r && K.pinHoles[k][1] === h.c; });
          P.fb = ["bad", (other ? "That's pin " + other.slice(4) + " (" + c.pinNames[other.slice(4)] + "). " : "Tap one of the chip's legs. ") +
            (K.isBread ? "With the notch on the left, pin 1 is bottom left. Count along the bottom row, then back along the top." : "With the notch at the top, pin 1 is top left. Count down the left side, then up the right.")];
        }
        return render();
      }
      if (pr.part) {
        if (got === pr.net) { P.fb = ["good", "Right. " + pr.part + "'s other leg goes on net " + pr.net + ": " + netWhere(K, pr.net) + "."]; advance(); }
        else if (got) P.fb = ["bad", "That's net " + got + " (" + c.netParts[got - 1].join(", ") + "). Find net " + pr.net + " on the diagram first, then its " + unit(K) + "."];
        else P.fb = ["bad", "Nothing is joined there. Net " + pr.net + " is already on the board: find its " + unit(K) + "."];
        return render();
      }
      var n = pr.net;
      if (got === n) { P.fb = ["good", "Right. Net " + n + " → " + netWhere(K, n) + "."]; advance(); }
      else if (got && netOnBoard(got)) P.fb = ["bad", "That " + unit(K) + " is net " + got + " (" + c.netParts[got - 1].join(", ") + "). Different numbers never share a " + unit(K) + "."];
      else if (s.pin) P.fb = ["bad", "Pin " + s.pin + " is on net " + n + ", so net " + n + " goes in the " + unit(K) + " pin " + s.pin + " is in. Use the pin buttons if you can't find it."];
      else { P.fb = ["fair", "A fair choice: that " + unit(K) + " is free, so net " + n + " could go there. This guide uses " + netWhere(K, n) + " so the parts fit. Your own plan can differ."]; advance(); }
      return render();
    }
    var net = netOfHole(K, h);
    state.focusNet = state.focusNet === net ? 0 : net;
    render();
  }
  function advance() {
    var P = state.prompts, pr = P.list[P.i];
    if (pr.net && !pr.part) P.done.push(pr.net);
    P.i++;
    if (P.i >= P.list.length) P.revealed = true;
  }

  function renderMistake() {
    var c = circ(), K = c.kinds.strip, m = c.mistakes[state.mi], key = c.id + state.mi, pick = state.picked[key];
    var solved = pick != null && m.options[pick].ok;
    var marks = solved ? m.focus.map(function (h) { return { r: h[0], c: h[1], kind: "hl" }; }) : [];
    var board = boardSVG(c, K, m.attempt, { marks: marks });
    var tabs = c.mistakes.map(function (x, i) { return '<button type="button" class="btn' + (i === state.mi ? " primary" : "") + '" data-mi="' + i + '">' + esc(x.title) + "</button>"; }).join("");
    var opts = m.options.map(function (o, i) {
      var cls = pick === i ? (o.ok ? " right" : " wrong") : (solved && o.ok ? " right" : "");
      return '<button type="button" class="opt' + cls + '" data-opt="' + i + '">' + o.t + "</button>";
    }).join("");
    var fb = pick == null ? "" : m.options[pick].ok
      ? '<div class="fb good">Right. The checker says: ' + m.msg + "</div>"
      : '<div class="fb bad">' + m.options[pick].fb + "</div>";
    $("main").innerHTML = '<div class="stephead"><h2>Spot the mistake</h2><div class="mtabs">' + tabs + "</div></div>" +
      '<div class="stage"><div class="col"><div class="fig">' + diagramSVG(c, { rings: true }) + '<p class="cap">The circuit it should be</p></div>' +
      '<div class="card"><p class="lead">One thing is wrong on this stripboard. What is it?</p><div class="opts">' + opts + "</div>" + fb + "</div></div>" +
      '<div class="col"><div class="fig board">' + board + '<p class="cap">' + esc(m.title) + (solved ? " · the mistake is ringed" : "") + "</p></div></div></div>";
  }

  function renderQuiz() {
    var c = circ(), first = 0, answered = 0;
    var html = c.quiz.map(function (q, qi) {
      var key = c.id + qi, a = state.quiz[key] || { picks: [] };
      if (a.picks.length) { answered++; if (q.o[a.picks[0]][1]) first++; }
      var last = a.picks[a.picks.length - 1];
      return '<div class="card qcard"><p class="lead">' + (qi + 1) + ". " + q.q + '</p><div class="opts">' + q.o.map(function (o, i) {
        var cls = a.picks.indexOf(i) >= 0 ? (o[1] ? " right" : " wrong") : "";
        return '<button type="button" class="opt' + cls + '" data-q="' + qi + '" data-o="' + i + '">' + o[0] + "</button>";
      }).join("") + "</div>" + (last != null ? '<div class="fb ' + (q.o[last][1] ? "good" : "bad") + '" aria-live="polite">' + q.o[last][2] + "</div>" : "") + "</div>";
    }).join("");
    $("main").innerHTML = '<div class="stephead"><h2>Quick quiz: ' + esc(c.short) + '</h2></div><p class="small">Use these at the start of the next lesson. Every answer explains itself.</p>' + html +
      (answered ? '<p class="score" aria-live="polite">First tries right: ' + first + " of " + answered + "</p>" : "");
  }

  function render() {
    renderTop();
    if (state.part === "diagram") renderDiagramPart();
    else if (state.part === "bread" || state.part === "strip") renderConvert(state.part);
    else if (state.part === "mistake") renderMistake();
    else renderQuiz();
  }

  /* ---------------------------------------------------- events */
  document.addEventListener("click", function (e) {
    var t = e.target.closest("button, g.ring");
    if (!t) return;
    if (t.dataset.ci != null) { state.ci = +t.dataset.ci; state.step = 0; state.prompts = null; state.focusNet = 0; state.focusPin = null; state.mi = 0; return render(); }
    if (t.dataset.part) { state.part = t.dataset.part; state.step = 0; state.prompts = null; state.focusNet = 0; state.focusPin = null; return render(); }
    if (t.dataset.step) { state.step += +t.dataset.step; state.prompts = null; return render(); }
    if (t.dataset.go != null) { state.step = +t.dataset.go; state.prompts = null; return render(); }
    if (t.dataset.net) { var n = +t.dataset.net; state.focusNet = state.focusNet === n ? 0 : n; return render(); }
    if (t.dataset.pin) { state.focusPin = String(state.focusPin) === t.dataset.pin ? null : t.dataset.pin; return render(); }
    if (t.id === "showMe") { var P = state.prompts; P.revealed = true; P.fb = ["fair", "Here is the answer. Match the lit " + unit(circ().kinds[state.part]) + " to its number on the diagram."]; return render(); }
    if (t.id === "ntCheck") return checkTable(false);
    if (t.id === "ntShow") return checkTable(true);
    if (t.dataset.mi != null) { state.mi = +t.dataset.mi; return render(); }
    if (t.dataset.opt != null) { state.picked[circ().id + state.mi] = +t.dataset.opt; return render(); }
    if (t.dataset.q != null) {
      var key = circ().id + t.dataset.q, a = state.quiz[key] || { picks: [] }, o = +t.dataset.o;
      if (a.picks.indexOf(o) < 0) a.picks.push(o); state.quiz[key] = a; return render();
    }
  });
  document.addEventListener("keydown", function (e) {
    if (e.target.closest && e.target.closest("g.ring") && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); e.target.closest("g.ring").dispatchEvent(new MouseEvent("click", { bubbles: true })); }
    if (e.target.tagName === "INPUT") return;
    if ((state.part === "diagram" || state.part === "bread" || state.part === "strip") && (e.key === "ArrowRight" || e.key === "ArrowLeft")) {
      var b = document.querySelector('.nav [data-step="' + (e.key === "ArrowRight" ? 1 : -1) + '"]');
      if (b && !b.disabled) b.click();
    }
  });
  document.addEventListener("change", function (e) {
    if (e.target.id === "tryFirst") {
      state.tryFirst = e.target.checked; state.prompts = null;
      try { localStorage.setItem("cct-v1", JSON.stringify({ tryFirst: state.tryFirst })); } catch (err) {}
      render();
    }
  });
  render();
})();
</script>
