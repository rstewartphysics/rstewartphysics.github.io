<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>N5 Engineering Science — Unit 1 Quiz</title>
<style>
:root{
  --bg:#f4f6f9; --card:#ffffff; --ink:#12212e; --muted:#5a6b7a;
  --line:#d9e0e8; --accent:#0b5fa5; --accent-soft:#e7f0f9;
  --ok:#0f7a3d; --ok-bg:#e4f5ea; --ok-line:#8dd0a8;
  --no:#b3261e; --no-bg:#fdeceb; --no-line:#f0aaa5;
  --on-accent:#ffffff;
  --shadow:0 1px 2px rgba(16,32,48,.06),0 8px 24px rgba(16,32,48,.07);
}
@media (prefers-color-scheme: dark){
:root{
  --bg:#111820; --card:#1a232d; --ink:#e8eef4; --muted:#9aabb9;
  --line:#2c3a47; --accent:#6cb6f5; --accent-soft:#17293a;
  --ok:#6bdd9b; --ok-bg:#14301f; --ok-line:#2f7a4d;
  --no:#ff9a92; --no-bg:#3a1a18; --no-line:#8a3831;
  --on-accent:#0b1620;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-text-size-adjust:100%}
.wrap{max-width:760px;margin:0 auto;padding:24px 18px 64px}
header h1{font-size:1.35rem;margin:0 0 2px;letter-spacing:-.01em}
header p{margin:0;color:var(--muted);font-size:.9rem}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:18px 0 14px}
select{font:inherit;font-size:.9rem;padding:8px 10px;border-radius:9px;border:1px solid var(--line);
  background:var(--card);color:var(--ink);max-width:100%}
.scorebar{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto;font-size:.85rem;color:var(--muted)}
.pill{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px;white-space:nowrap}
.pill b{color:var(--ink);font-variant-numeric:tabular-nums}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;
  box-shadow:var(--shadow);padding:20px 20px 18px;margin-top:6px}
.tag{display:inline-block;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;
  color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:3px 8px;margin-bottom:12px}
.qtext{font-size:1.08rem;font-weight:600;margin:0 0 16px;line-height:1.45}
.opts{display:flex;flex-direction:column;gap:9px}
button.opt{display:flex;gap:11px;align-items:flex-start;text-align:left;width:100%;
  font:inherit;padding:12px 14px;border-radius:11px;border:1.5px solid var(--line);
  background:var(--card);color:var(--ink);cursor:pointer;transition:border-color .12s,background .12s}
button.opt:hover:not(:disabled){border-color:var(--accent)}
button.opt:disabled{cursor:default}
.ltr{flex:0 0 24px;height:24px;border-radius:6px;background:var(--bg);border:1px solid var(--line);
  display:grid;place-items:center;font-size:.8rem;font-weight:700;color:var(--muted)}
.opt.correct{background:var(--ok-bg);border-color:var(--ok-line)}
.opt.correct .ltr{background:var(--ok);border-color:var(--ok);color:var(--card)}
.opt.wrong{background:var(--no-bg);border-color:var(--no-line)}
.opt.wrong .ltr{background:var(--no);border-color:var(--no);color:var(--card)}
.opt.dim{opacity:.55}
.feedback{margin-top:16px;padding:12px 14px;border-radius:11px;font-weight:600;display:none}
.feedback.show{display:block}
.feedback.right{background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok-line)}
.feedback.notright{background:var(--no-bg);color:var(--no);border:1px solid var(--no-line)}
.feedback span{display:block;font-weight:400;color:var(--ink);margin-top:4px;font-size:.94rem}
.row{display:flex;gap:10px;align-items:center;margin-top:16px}
button.next{font:inherit;font-weight:600;padding:11px 20px;border-radius:10px;border:0;
  background:var(--accent);color:var(--on-accent);cursor:pointer}
button.next:disabled{opacity:.4;cursor:default}
button.ghost{font:inherit;font-size:.85rem;padding:9px 14px;border-radius:10px;
  border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer}
.hint{margin-top:18px;color:var(--muted);font-size:.8rem;text-align:center}
sub{font-size:.72em}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>N5 Engineering Science — Unit 1</h1>
  <p>Contexts and Systems &middot; Energy and Efficiency &middot; random practice questions</p>
</header>

<div class="controls">
  <select id="topic" aria-label="Choose a topic"></select>
  <div class="scorebar">
    <span class="pill">Score <b id="score">0</b> / <b id="asked">0</b></span>
    <span class="pill"><b id="pct">—</b></span>
    <span class="pill">Streak <b id="streak">0</b></span>
  </div>
</div>

<div class="card">
  <span class="tag" id="tag">&nbsp;</span>
  <p class="qtext" id="qtext"></p>
  <div class="opts" id="opts"></div>
  <div class="feedback" id="fb"></div>
  <div class="row">
    <button class="next" id="next" disabled>Next question</button>
    <button class="ghost" id="reset">Reset score</button>
  </div>
</div>

<p class="hint">Press <b>1</b>–<b>4</b> to answer, <b>Enter</b> for the next question.</p>
</div>

<script id="quizdata" type="application/json">__DATA__</script>
<script>
(function(){
  var DATA = JSON.parse(document.getElementById('quizdata').textContent);
  var SECTIONS = DATA.sections, ALL = DATA.questions;
  var pool = [], deck = [], current = null, locked = false;
  var score = 0, asked = 0, streak = 0;

  var topic = document.getElementById('topic');
  var opt = function(v,t){ var o=document.createElement('option'); o.value=v; o.textContent=t; return o; };
  topic.appendChild(opt('all','Everything (' + ALL.length + ' questions)'));
  [1,2].forEach(function(b){
    var n = ALL.filter(function(q){ return SECTIONS[q.s].booklet===b; }).length;
    var name = b===1 ? 'Booklet 1 — Contexts and Systems' : 'Booklet 2 — Energy and Efficiency';
    topic.appendChild(opt('b'+b, name + ' (' + n + ')'));
  });
  SECTIONS.forEach(function(s){
    var n = ALL.filter(function(q){ return q.s===s.id; }).length;
    var plain = s.title.replace(/<[^>]+>/g,'');
    topic.appendChild(opt('s'+s.id, '   ' + (s.id+1) + '. ' + plain + ' (' + n + ')'));
  });

  function shuffle(a){
    for (var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
    return a;
  }
  function setPool(){
    var v = topic.value;
    pool = ALL.filter(function(q){
      if (v==='all') return true;
      if (v.charAt(0)==='b') return SECTIONS[q.s].booklet === parseInt(v.slice(1),10);
      return q.s === parseInt(v.slice(1),10);
    });
    deck = [];
  }
  function draw(){
    if (!deck.length) deck = shuffle(pool.slice());
    if (deck.length > 1 && current && deck[deck.length-1] === current) {
      var t = deck.pop(); deck.unshift(t);
    }
    return deck.pop();
  }

  var tag=document.getElementById('tag'), qtext=document.getElementById('qtext'),
      optsEl=document.getElementById('opts'), fb=document.getElementById('fb'),
      nextBtn=document.getElementById('next');

  function render(){
    current = draw();
    locked = false;
    var order = shuffle([0,1,2,3]);
    current._order = order;
    tag.innerHTML = 'Booklet ' + SECTIONS[current.s].booklet + ' &middot; ' + SECTIONS[current.s].title;
    qtext.innerHTML = current.q;
    optsEl.innerHTML = '';
    order.forEach(function(oi, pos){
      var b = document.createElement('button');
      b.className = 'opt';
      b.innerHTML = '<span class="ltr">' + 'ABCD'.charAt(pos) + '</span><span>' + current.o[oi] + '</span>';
      b.onclick = function(){ answer(pos); };
      optsEl.appendChild(b);
    });
    fb.className = 'feedback';
    fb.innerHTML = '';
    nextBtn.disabled = true;
  }

  function answer(pos){
    if (locked) return;
    locked = true;
    var order = current._order;
    var correctPos = order.indexOf(current.a);
    var btns = optsEl.querySelectorAll('button.opt');
    for (var i=0;i<btns.length;i++){
      btns[i].disabled = true;
      if (i === correctPos) btns[i].classList.add('correct');
      else if (i === pos) btns[i].classList.add('wrong');
      else btns[i].classList.add('dim');
    }
    asked++;
    if (pos === correctPos){
      score++; streak++;
      fb.className = 'feedback show right';
      fb.innerHTML = 'Correct.';
    } else {
      streak = 0;
      fb.className = 'feedback show notright';
      fb.innerHTML = 'Not quite — the correct answer is ' + 'ABCD'.charAt(correctPos) +
                     '.<span>' + current.o[current.a] + '</span>';
    }
    updateScore();
    nextBtn.disabled = false;
    nextBtn.focus();
  }

  function updateScore(){
    document.getElementById('score').textContent = score;
    document.getElementById('asked').textContent = asked;
    document.getElementById('streak').textContent = streak;
    document.getElementById('pct').textContent = asked ? Math.round(score/asked*100) + '%' : '—';
  }

  nextBtn.onclick = render;
  document.getElementById('reset').onclick = function(){
    score = 0; asked = 0; streak = 0; updateScore(); setPool(); render();
  };
  topic.onchange = function(){ setPool(); render(); };
  document.addEventListener('keydown', function(e){
    if (e.key >= '1' && e.key <= '4'){ answer(parseInt(e.key,10)-1); }
    else if ((e.key === 'Enter' || e.key === ' ') && !nextBtn.disabled){ e.preventDefault(); render(); }
  });

  setPool(); render(); updateScore();
})();
</script>
</body>
</html>
