# N5 Space — misconception records (SPACE-PLATFORM-PLAN-v2 §9).
# One record feeds the page card, the Misconception Check tool, quiz
# distractors and the deck WCGW line. A record with shown: true must carry a
# full diagnostic: every option has feedback, exactly one is key, and the
# key's feedback starts "Right." (scripts/check-topic-data.mjs enforces this).

- id: M1
  topic: n5-space
  spec: [SE12]
  idea: "There is no gravity in space or on the Moon."
  why: "Floating astronauts on TV."
  evidence: "2023 and 2024 Course Reports; 2026 S2 open-ended item."
  stem: "Gravity on the Moon is…"
  fix: "Gravity reaches far into space. On the Moon g = 1.6 N/kg (data sheet)."
  returns_in: [R1, R3, PT-A]

- id: M2
  topic: n5-space
  spec: [SE5, SE12]
  idea: "Astronauts float, and satellites are weightless, because gravity has gone."
  why: "Floating astronauts on TV."
  evidence: "2024 S1 Q5: some chose \"weightless\"."
  stem: "Why does an astronaut float in the ISS?"
  fix: "The astronaut and the station fall together. Weight still acts on both."
  returns_in: [R1, R3]

- id: M3
  topic: n5-space
  spec: [SE12]
  idea: "Mass and weight are the same thing."
  why: "Everyday \"weigh\" in kilograms."
  evidence: "W = mg unit errors."
  stem: "A 70 kg astronaut stands on the Moon. What is the astronaut's mass?"
  fix: "Mass, in kg, never changes. Weight, in N, depends on where you are."
  returns_in: [R1, R2]

