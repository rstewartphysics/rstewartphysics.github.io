- id: M5
  topic: n5-space
  spec: [SE5]
  idea: "Satellites need engines to stay in orbit."
  why: "Cars need engines to keep going."
  evidence: "Projectile-orbit items."
  stem: "A satellite's engine is off in orbit. The satellite…"
  fix: "It falls while it moves sideways. No force is needed along its path."
  returns_in: [R2]

- id: M6
  topic: n5-space
  spec: [SE11]
  shown: true
  idea: "Rockets push against the air."
  why: "Pushing seems to need something to push on."
  evidence: "Water rocket items."
  stem: "Can a rocket accelerate in empty space, where there is no air?"
  options:
    - { text: "No. There is nothing for it to push against.", feedback: "The rocket doesn't need air. It pushes on its own exhaust gas. Think about who pushes whom." }
    - { text: "Yes. The rocket pushes gas back and the gas pushes the rocket forward.", key: true, feedback: "Right. That is a Newton pair: rocket on gas, gas on rocket. No air is needed, so it works in space." }
    - { text: "Only if it carries its own air to push against.", feedback: "Rockets do carry oxygen, but to burn the fuel, not to push on. The push comes from the exhaust gas." }
  fix: "The rocket pushes gas back. The gas pushes the rocket forward (Newton 3). No air is needed."
  returns_in: [R1, R3]

- id: M7
  topic: n5-space
  spec: [SE8]
  idea: "A spacecraft stops when its engine stops."
  why: "On Earth, friction stops things."
  evidence: "2022 S1 Q9."
  stem: "A craft is in deep space with its engine off. The craft…"
  fix: "It keeps moving at a constant velocity (Newton 1)."
  returns_in: [R2]

- id: M8
  topic: n5-space
  spec: [SE11]
  shown: true
  idea: "The unbalanced force at lift-off is the thrust."
  why: "Thrust is the big number in the question."
  evidence: "2025 Course Report, S2 Q2(a)(ii): some did not subtract the weight."
  stem: "Thrust 30 kN, weight 25 kN. What is the unbalanced force on the rocket?"
  options:
    - { text: "30 kN", feedback: "That is the thrust. The weight acts down at the same time, so it must come off." }
    - { text: "55 kN", feedback: "The forces act in opposite directions, so they don't add. Subtract." }
    - { text: "5 kN", key: true, feedback: "Right. Unbalanced force = thrust − weight = 30 − 25 = 5 kN, upwards." }
  fix: "Draw both arrows. Unbalanced force = thrust − weight. Then use F = ma."
  figure: lift-off-arrows.svg
  returns_in: [R1, R3, PT-A]

