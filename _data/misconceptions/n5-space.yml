- id: M21
  topic: n5-space
  spec: [SE11]
  shown: true
  idea: "Thrust and weight are a Newton pair."
  why: "They are equal and opposite when a rocket hovers."
  evidence: "Teacher observation; 2024 S1 Q3 (Newton pair item, done well — keep it that way)."
  stem: "The engines push the exhaust gas down. The Newton pair to this force is…"
  options:
    - { text: "the weight of the rocket, acting down", feedback: "Both forces in a Newton pair act on different objects. The weight and the thrust both act on the rocket, so they can't be a pair." }
    - { text: "the gas pushing the rocket up", key: true, feedback: "Right. Rocket on gas, gas on rocket: two objects, equal size, opposite directions." }
    - { text: "the air pushing the rocket up", feedback: "The air isn't part of this push. The rocket pushes the gas, so look for the gas pushing back." }
  fix: "A Newton pair acts on two different objects: rocket on gas, gas on rocket. Thrust and weight both act on the rocket."
  returns_in: [R1, PT-A]
