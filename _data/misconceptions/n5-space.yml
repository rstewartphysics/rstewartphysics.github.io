- id: M16
  topic: n5-space
  spec: [SE11, SE12]
  shown: true
  idea: "Acceleration stays the same as a craft rises."
  why: "g is treated as fixed, and the mass as constant."
  evidence: "2024 Course Report, S2 Q4(c)."
  stem: "A rocket rises with the same thrust from its engines. Its fuel burns as it climbs. Its acceleration…"
  options:
    - { text: "stays the same", feedback: "The thrust stays the same, but the rocket does not. Burning fuel cuts its mass, and so its weight. What does that do to the unbalanced force?" }
    - { text: "increases", key: true, feedback: "Right. The mass falls, so the weight falls and the unbalanced force (thrust − weight) grows. A bigger force on a smaller mass gives a bigger acceleration." }
    - { text: "decreases", feedback: "Check what gets smaller. It is the weight, not the thrust, so the unbalanced force gets bigger, not smaller." }
  fix: "Weight falls, so the unbalanced force and the acceleration rise."
  returns_in: [R3, PT-A]

