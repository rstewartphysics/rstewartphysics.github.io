      - id: light-years
        title: Light years
        lesson: L9
        live: true
        spec: [C1]
        deck:
          name: L9 — Light Years
          pdf: /classes/s3-physics/slides/l9-light-years.pdf
          answers: /classes/s3-physics/slides/l9-light-years-answers.pdf
        missed:
          - "A <b>light year</b> is a <b>distance</b>: how far light travels in one year."
          - "To change light years into metres, use <var>d</var> = <var>vt</var> with <var>v</var> = 3.0 × 10<sup>8</sup> m s<sup>−1</sup>."
          - "Turn the years into <b>seconds</b> first: 1 year = 365 × 24 × 60 × 60 = 3.15 × 10<sup>7</sup> s."
          - "Light from a star takes years to reach us, so we see the star <b>as it was</b> when the light left it."
        # ORIGINAL predict: no real item asks it in this shape; it previews 2022 S2 Q5(b) (seen as it was).
        predict:
          q: "Rigel is 860 light years from Earth. Tonight you look at Rigel. You see it as it was…"
          options:
            - { text: "tonight", feedback: "Light is fast, but the distance is huge. The light you see tonight set off a long time ago." }
            - { text: "860 days ago", feedback: "Close. A light year is how far light goes in one <b>year</b>, not one day. So the light took 860 years." }
            - { text: "860 years ago", key: true, feedback: "Right. The light took 860 years to reach you, so you see Rigel as it was 860 years ago." }
        keypoint: "A <b>light year</b> is a <b>distance</b>: how far light travels in one year. To get metres, use <var>d</var> = <var>vt</var> with the time in <b>seconds</b>."
        explain:
          - "Stars are so far away that metres give huge numbers. Astronomers use a bigger unit: the <b>light year</b>. It sounds like a time, but it is a <b>distance</b>."
          - "Light travels at 3.0 × 10<sup>8</sup> m s<sup>−1</sup>. In one year that is <var>d</var> = <var>vt</var> = 3.0 × 10<sup>8</sup> × (365 × 24 × 60 × 60) = 9.46 × 10<sup>15</sup> m. That is one light year."
          - "To change light years into metres, put the number of years into the time: years × 365 × 24 × 60 × 60 seconds. To go back from metres to light years, find <var>t</var> = <var>d</var> ÷ <var>v</var> in seconds, then divide by 365 × 24 × 60 × 60."
          - "Light from a star 100 light years away left it 100 years ago. We see the star <b>as it was</b> then, not as it is now."
        worked:
          id: we-light-years-1
          q: "Proxima Centauri is 4.2 light years from Earth. Calculate this distance in metres."
          marks: 3
          steps:
            - { label: "Information", work: "<var>d</var> = ?&emsp;<var>v</var> = 3.0 × 10<sup>8</sup> m s<sup>−1</sup>&emsp;<var>t</var> = 4.2 years" }
            - { label: "Equation", work: "<var>d</var> = <var>vt</var>" }
            - { label: "Substitution", work: "<var>d</var> = 3.0 × 10<sup>8</sup> × (4.2 × 365 × 24 × 60 × 60)" }
            - { label: "Solution", work: "<var>d</var> = 3.97 × 10<sup>16</sup>" }
            - { label: "Units, underline", work: "<b><u><var>d</var> = 3.97 × 10<sup>16</sup> m</u></b>" }
          warn: "Write <var>d</var> = <var>vt</var> first. \"Many candidates omitted to include a correct relationship in their response.\" (2023 Course Report)"
        misconceptions: [M9]
        figure: fig-light-years.html
        # CO1 items, every N5 paper 2014–2026 read for the resource map (n5-physics/cosmology, 20 Nov 2026).
        # Years with an item: 2015, 2017, 2018, 2019, 2022–2026. Also 2015 S1 Q19 (over the 8-reference cap).
        exam:
          refs: ["2026 S1 Q7", "2025 S1 Q9", "2024 S2 Q6(b)", "2023 S2 Q5(c)", "2022 S2 Q5(a)", "2019 S2 Q4(b)", "2018 S1 Q9", "2017 S2 Q12(a)"]
          years: 9
          of: 11
          item:
            label: "2023 Section 2, Question 5(c)"
            marks: 2
            crop: /assets/s3/space/sqa-2023-s2-q5c.png
            mi: /assets/s3/space/sqa-2023-s2-q5c-mi.png
            size: [1300, 173]
            mi_size: [1443, 698]
            alt: "2023 National 5 Physics, Section 2, Question 5(c). The star is 343 light-years from Earth. Show that the distance from the star to Earth is 3.2 × 10¹⁸ m (2 marks)."
            mi_alt: "Marking instructions, 5(c), 2 marks. d = vt (1 mark). d = 3.0 × 10⁸ × (343 × 365.25 × 24 × 60 × 60) (1 mark). d = 3.2 × 10¹⁸ m. A show question: accept d = st for the relationship if the substitution makes it clear. The calculation can be done in steps, but all steps must be shown for the substitution mark. The final answer of 3.2 × 10¹⁸ m, with its unit, must be shown or a maximum of 1 mark. Accept the use of 365 days."
            credit: "National 5 Physics 2023 question paper (Section 2, Question 5(c)) and its marking instructions © Qualifications Scotland (SQA), reproduced for educational use"
            prog: exam-2023-q5c
