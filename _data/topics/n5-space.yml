            mi_alt: "Marking instructions. (b)(i): W = mg (1 mark), W = 5.5 × 10⁵ × 9.8 (1 mark), W = 5.4 × 10⁶ N. It is a show question, so the final answer with its unit must be shown, or a maximum of 1 mark. (b)(ii): F = ma (1 mark), F = 5.5 × 10⁵ × 4.1 (1 mark), then thrust − weight = F: thrust − 5.4 × 10⁶ = 5.5 × 10⁵ × 4.1 (1 mark), thrust = 7.7 × 10⁶ N (1 mark). Also accepted: 8 × 10⁶, 7.66 × 10⁶ and 7.655 × 10⁶."
