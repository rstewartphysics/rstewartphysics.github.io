  # SPACE-PLATFORM-PLAN-v2 §11. What earns the mark, one line each.
  command_words:
    - { word: State, marks: "Give the fact. No reason needed." }
    - { word: Describe, marks: "Say what happens, in order." }
    - { word: Explain, marks: "Give the cause and the effect: <i>because</i> … <i>so</i> …" }
    - { word: Calculate, marks: "Relationship, numbers in, answer with its unit." }
    - { word: Determine, marks: "Work it out. It may take more than one step." }
    - { word: Predict, marks: "Say what will happen, from the facts given." }
    - { word: Justify, marks: "Give the choice, then the physics reason for it." }
    - { word: Show that, marks: "Every step shown. The final value is given, so the working gets the marks." }
  marks_line: "1 mark = one fact. 2 marks = fact + reason. Open-ended questions are marked 0–3 on the quality of the physics."

# Learn pages. Sections are listed in teaching order; live: false shows
# "coming soon" in the section nav until the section is built.
pages:
  b:
    title: Space exploration
    url: /classes/s3-physics/space/space-exploration.html
    badge: space-b
    sections:
      - { id: risks, title: Risks of space travel, lesson: L3, live: false }
      - { id: getting-around, title: Getting around in space, lesson: L4, live: false }
      - { id: satellites, title: Satellites, lesson: L5, live: false }
      - id: lift-off
        title: Forces on rockets
        lesson: L6
        live: true
        spec: [SE11, SE12]
        deck:
          name: L6 — Forces on Rockets
          pdf: /classes/s3-physics/slides/l6-forces-on-rockets.pdf
          answers: /classes/s3-physics/slides/l6-forces-on-rockets-answers.pdf
        missed:
          - "<b>Thrust</b> pushes the rocket up. <b>Weight</b> pulls it down."
          - "Unbalanced force = thrust − weight. It makes the rocket accelerate."
          - "Burning fuel cuts the mass and the weight, so the acceleration grows."
        predict:
          q: "A rocket's engines give a thrust of 30 kN. Its weight is 25 kN. What is the unbalanced force on it at lift-off?"
          options:
            - { text: "30 kN up", feedback: "That is the thrust on its own. The weight pulls down at the same time, so some of the thrust is used up holding the rocket against gravity." }
            - { text: "55 kN up", feedback: "The two forces act in opposite directions, so they don't add. Subtract the smaller from the bigger." }
            - { text: "5 kN up", key: true, feedback: "Right. Thrust and weight act in opposite directions: 30 − 25 = 5 kN, upwards because the thrust is bigger." }
        keypoint: "At lift-off, <b>unbalanced force = thrust − weight</b>. Work it out <b>before</b> you use <var>F</var> = <var>ma</var>."
        explain:
          - "Two forces act on a rocket on the launch pad. The engines push gas down, so the gas pushes the rocket up: that is the <b>thrust</b>. Gravity pulls the rocket down: that is its <b>weight</b>, <var>W</var> = <var>mg</var>."
          - "If the thrust is bigger than the weight, there is an <b>unbalanced force</b> upwards and the rocket accelerates up. If the thrust is smaller than the weight, the rocket stays on the pad."
          - "As the fuel burns, the rocket's mass falls. Its weight falls too, so the unbalanced force grows. A bigger force on a smaller mass gives a bigger acceleration."
        worked:
          id: we-lift-off-1
          q: "A rocket of mass 2400 kg has a thrust of 36 000 N at lift-off. Air resistance can be ignored. Determine the initial acceleration of the rocket."
          marks: 4
          steps:
            - { label: "Weight", work: "<var>W</var> = <var>mg</var> = 2400 × 9.8 = 23 520 N" }
            - { label: "Unbalanced force", work: "<var>F</var> = thrust − weight = 36 000 − 23 520 = 12 480 N" }
            - { label: "Acceleration", work: "<var>a</var> = <var>F</var> ÷ <var>m</var> = 12 480 ÷ 2400 = <b>5.2 m s<sup>−2</sup></b>" }
          warn: "No unbalanced force worked out = only 1 mark out of 4 (2025 marking instructions)."
          stepper: /tools/stepper.html?set=n5-space&mode=lift-off
        misconceptions: [M6, M8, M16, M21]
        exam: null      # filled at page-B build: exam-ref line + 2026 S2 Q4(b) crop and MI
        retrieve: R1
