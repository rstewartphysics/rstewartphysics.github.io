# Site search (scripts/build-search.mjs). Pages listed here are left out of the index.
# A page can also leave itself out with `search: false` in its front matter; pages with
# `sitemap: false`, a robots "noindex" meta or a redirect are left out automatically.
# Patterns match the page's URL; * matches anything except /, ** matches across folders.
exclude:
  - /assets/**
  - /test/**
  - /pneu/**
  - /pneu1/**
  - /pneu2/**
  - /classes/workinprogress.html
  - /classes/materials-unavailable.html
  - /classes/engineering/unlisted/**
  - "**/placeholder.html"
  - "**/*-teacher.html"
  - "**/*-alpha.html"
  - "**/*-beta.html"
