{%- comment -%} Key-point figure for page C §light-years: light leaves a star, travels for years, reaches Earth. Same numbers as the worked example (Proxima Centauri, 4.2 light years). {%- endcomment -%}
<style>
  .fly-earth { fill: none; stroke: var(--text); stroke-width: 3; }
  .fly-land { fill: var(--text); opacity: .25; }
  .fly-star { fill: var(--sim-c2, #c2410c); }
  .fly-ray { stroke: var(--sim-c2, #c2410c); stroke-width: 3; stroke-dasharray: 10 7; fill: none; }
  .fly-head { fill: var(--sim-c2, #c2410c); }
  .fly-dim { stroke: var(--text); stroke-width: 2; }
  .fly-lab { fill: var(--text); font: 800 16px var(--font-stack, "Trebuchet MS", sans-serif); }
  .fly-note { fill: var(--muted); font: 700 15px var(--font-stack, "Trebuchet MS", sans-serif); }
</style>
<svg class="fly" viewBox="0 0 340 230" role="img" aria-labelledby="fly-t">
  <title id="fly-t">Proxima Centauri on the left gives out light. A dashed arrow of light travels right to the Earth. The gap between them is marked 4.2 light years, which is 3.97 times ten to the sixteen metres. The light takes 4.2 years to make the trip.</title>
  <path class="fly-star" d="M40 70 L46 88 L64 88 L50 99 L55 117 L40 106 L25 117 L30 99 L16 88 L34 88 Z"/>
  <text class="fly-lab" x="40" y="146" text-anchor="middle">Proxima</text>
  <text class="fly-lab" x="40" y="164" text-anchor="middle">Centauri</text>
  <line class="fly-ray" x1="72" y1="96" x2="262" y2="96"/>
  <path class="fly-head" d="M278 96 L260 86 L260 106 Z"/>
  <text class="fly-note" x="170" y="80" text-anchor="middle">light travels for 4.2 years</text>
  <circle class="fly-earth" cx="304" cy="96" r="24"/>
  <path class="fly-land" d="M292 82 C300 78 310 84 306 92 C302 100 294 96 292 104 C288 98 286 88 292 82 Z"/>
  <text class="fly-lab" x="304" y="146" text-anchor="middle">Earth</text>
  <line class="fly-dim" x1="40" y1="190" x2="304" y2="190"/>
  <line class="fly-dim" x1="40" y1="182" x2="40" y2="198"/>
  <line class="fly-dim" x1="304" y1="182" x2="304" y2="198"/>
  <text class="fly-lab" x="172" y="184" text-anchor="middle">4.2 light years</text>
  <text class="fly-note" x="172" y="216" text-anchor="middle">= 3.97 × 10¹⁶ m</text>
</svg>
<figcaption>The distance is 4.2 light years, so the light takes 4.2 years. We see the star as it was 4.2 years ago.</figcaption>
