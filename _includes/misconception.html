{% comment %}Step 5 Check. {% include misconception.html topic="n5-space" id="M8" %}{% endcomment %}{% assign m = site.data.misconceptions[include.topic] | where: "id", include.id | first %}
<div class="sim-predict misc-card tp-step" data-poe id="misc-{{ m.id | downcase }}" aria-labelledby="misc-{{ m.id | downcase }}-q">
  <p class="misc-tag">Common mistake</p>
  <p class="sim-q" id="misc-{{ m.id | downcase }}-q">{{ m.stem }}</p>
  <div class="sim-choices" role="group" aria-label="Your answer">
{%- for o in m.options %}
    <button type="button" data-predict="{{ forloop.index }}"{% if o.key %} data-key{% endif %} aria-pressed="false">{{ o.text }}<template data-feedback><p>{{ o.feedback }}</p><p class="misc-fix"><b>Remember:</b> {{ m.fix }}</p></template></button>
{%- endfor %}
  </div>
  <div data-reveal hidden aria-live="polite"></div>
</div>
