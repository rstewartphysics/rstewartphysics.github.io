{%- comment -%} Key-point figure for page B §lift-off. Rocket outline and force colours match the Lift-off Lab (A1). {%- endcomment -%}
<style>

</style>
<svg class="flo" viewBox="0 0 330 320" role="img" aria-labelledby="flo-t">
  <title id="flo-t">A rocket on its launch pad. The thrust arrow points up and is longer than the weight arrow, which points down. Beside them, a short dashed arrow pointing up is the unbalanced force: thrust minus weight.</title>
  <line class="flo-pad" x1="14" y1="296" x2="132" y2="296"/>
  <path class="flo-flame" d="M64 276 L73 290 L82 276 Z"/>
  <path class="flo-fin" d="M58 222 L42 262 L42 272 L58 262 Z M88 222 L104 262 L104 272 L88 262 Z"/>
  <path class="flo-body" d="M73 96 C83 108 88 124 88 140 V272 H58 V140 C58 124 63 108 73 96 Z"/>
  <circle class="flo-dot" cx="170" cy="180" r="4"/>
  <g class="fa c3">
    <line class="fa-shaft" x1="170" y1="180" x2="170" y2="66"/>
    <path class="fa-head" d="M170 52 L161 68 L179 68 Z"/>
    <text class="fa-label" x="182" y="64">thrust</text>
  </g>
  <g class="fa">
    <line class="fa-shaft" x1="170" y1="180" x2="170" y2="266"/>
    <path class="fa-head" d="M170 280 L161 264 L179 264 Z"/>
    <text class="fa-label" x="182" y="282">weight</text>
  </g>
  <g class="fa c1 fa-dashed">
    <line class="fa-shaft" x1="262" y1="180" x2="262" y2="160"/>
    <path class="fa-head" d="M262 146 L253 162 L271 162 Z"/>
    <text class="fa-label" x="262" y="112" text-anchor="middle">unbalanced</text>
    <text class="fa-label" x="262" y="128" text-anchor="middle">force</text>
  </g>
  <text class="flo-note" x="262" y="204" text-anchor="middle">= thrust</text>
  <text class="flo-note" x="262" y="220" text-anchor="middle">− weight</text>
</svg>
<figcaption>Thrust up, weight down. What is left over is the unbalanced force.</figcaption>
